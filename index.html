:root{
  --bg:#0a0c1d; --panel:#141832; --panel-2:#1c2147; --panel-3:#262c5e;
  --paper:#141832; --ink:#eef1ff; --ink-2:#c3c9f0; --muted:#8890c8;
  --line:#2f3675; --line-2:#434c9e; --edge:#04050d;
  --cyan:#3be8ff; --magenta:#ff4fd8; --violet:#8b6bff;
  --brand:#8b6bff; --brand-2:#3be8ff; --brand-soft:rgba(139,107,255,.2);
  --star:#ffd23f; --star-ink:#ffd23f; --star-soft:rgba(255,210,63,.14);
  --green:#3dff8b; --green-soft:rgba(61,255,139,.13);
  --yellow:#ffd23f; --yellow-soft:rgba(255,210,63,.15);
  --red:#ff4d5e; --red-soft:rgba(255,77,94,.17);
  --teal:#3be8ff; --teal-soft:rgba(59,232,255,.13);
  --pink:#ff7ad9; --pink-soft:rgba(255,122,217,.15);
  --pixel:"PS2P","Courier New",monospace;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --hard:6px 6px 0 rgba(0,0,0,.55);
  --bevel:inset -3px -3px 0 rgba(0,0,0,.32),inset 3px 3px 0 rgba(255,255,255,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
html{background:var(--bg)}
body{min-height:100vh;background:radial-gradient(1100px 600px at 85% -10%,rgba(139,107,255,.28),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(255,79,216,.16),transparent 60%);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:500;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--pixel);font-weight:400;margin:0;line-height:1.45;letter-spacing:0}
h1{font-size:24px} h2{font-size:13px} h3{font-size:11px}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
::selection{background:var(--magenta);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Sternenfeld */
#starfield{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sf{position:absolute;left:0;top:0;box-shadow:var(--s);animation:drift linear infinite}
.sf::after{content:"";position:absolute;left:0;top:2000px;width:inherit;height:inherit;box-shadow:var(--s)}
@keyframes drift{to{transform:translateY(-2000px)}}

/* Basis */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:12px 14px;font-family:var(--pixel);font-size:10px;line-height:1.4;text-transform:uppercase;border:3px solid var(--edge);box-shadow:var(--bevel),0 4px 0 var(--edge);transition:transform .05s steps(1),filter .1s;white-space:nowrap;position:relative}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:var(--bevel),0 0 0 var(--edge)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.btn-primary{background:var(--cyan);color:#04121a}
.btn-brand{background:var(--violet);color:#fff}
.btn-star{background:var(--star);color:#2a1d00}
.btn-ghost{background:var(--panel-3);color:var(--ink)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:8px 10px;font-size:9px}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:7px 10px;background:var(--panel-2);border:2px solid var(--line-2);font-size:.82rem;font-weight:600;color:var(--ink-2);transition:all .1s}
.chip:hover{border-color:var(--cyan);color:var(--ink)}
.chip.on{background:var(--cyan);border-color:var(--edge);color:#04121a;box-shadow:0 3px 0 var(--edge)}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:var(--hard),inset 0 3px 0 rgba(255,255,255,.04)}
.label{font-family:var(--pixel);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.9rem}
.field>span{font-family:var(--pixel);font-size:8px;text-transform:uppercase;color:var(--cyan);letter-spacing:.04em}
.input,.textarea,.select{width:100%;padding:.7em .8em;background:#2a3274;border:3px solid var(--line-2);color:var(--ink);border-radius:0;transition:border-color .1s,box-shadow .1s}
.input::placeholder,.textarea::placeholder{color:#5f679f}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(59,232,255,.18),0 0 18px rgba(59,232,255,.25)}
.select option{background:var(--panel)}
input[type=date]{color-scheme:dark}
.textarea{resize:vertical;min-height:84px;line-height:1.45}
.hint{font-size:.82rem;color:var(--muted);line-height:1.5;margin:.2rem 0 0}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.star-ico{width:1em;height:1em;display:inline-block;vertical-align:-.12em;flex:none}
.empty{padding:1.2rem;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.5}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* Marke */
.brand{display:flex;align-items:center;gap:.7rem;font-family:var(--pixel);font-size:13px;color:var(--cyan);text-shadow:2px 2px 0 var(--magenta)}
.brand-mark{width:38px;height:38px;background:var(--panel-2);border:3px solid var(--edge);display:grid;place-items:center;box-shadow:var(--bevel)}
.brand-mark svg{width:22px;height:22px}
.brand small{display:block;font-family:var(--font);font-weight:600;font-size:.72rem;color:var(--muted);text-shadow:none;margin-top:4px}

/* Avatar */
.av{display:block;overflow:hidden;background:#232a66;flex:none;border:3px solid var(--edge);box-shadow:0 0 0 2px var(--line-2)}
.av svg{display:block;width:100%;height:100%}

/* Ampel klein */
.ampel-mini{display:inline-flex;gap:3px;padding:3px;background:#05060f;border:2px solid #2a2f5c}
.ampel-mini i{width:8px;height:8px;background:#2b2f55;display:block}
.ampel-mini i.g.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.ampel-mini i.y.on{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.ampel-mini i.r.on{background:var(--red);box-shadow:0 0 6px var(--red)}

/* Toasts */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:450;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--panel-2);color:var(--ink);padding:12px 14px;border:3px solid var(--cyan);box-shadow:var(--hard);font-family:var(--pixel);font-size:9px;line-height:1.7;display:flex;gap:.8em;align-items:center;animation:toastIn .2s steps(3)}
.toast.out{animation:toastOut .2s steps(3) forwards}
.toast.star{border-color:var(--star);color:var(--star)}
.toast.bad{border-color:var(--red);color:#ffb3ba}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.modal-backdrop{position:absolute;inset:0;background:rgba(16,18,50,.62);animation:fade .15s}
.modal{position:relative;background:var(--panel);border:3px solid var(--line-2);box-shadow:10px 10px 0 rgba(0,0,0,.6),0 0 60px rgba(139,107,255,.25);width:min(100%,480px);max-height:calc(100vh - 32px);overflow:auto;animation:pop .18s steps(4)}
.modal.wide{width:min(100%,1000px)}
.modal.side{width:min(100%,540px)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.modal-pad{padding:1.5rem}
.modal h2{margin-bottom:.8rem;color:var(--cyan)}
.modal p{color:var(--ink-2);line-height:1.55;margin:.2rem 0 1rem}
.modal-actions{display:flex;gap:.7rem;justify-content:flex-end;margin-top:1.2rem;flex-wrap:wrap;align-items:center}
.x-btn{position:absolute;top:12px;right:12px;width:36px;height:36px;display:grid;place-items:center;background:var(--panel-3);border:3px solid var(--edge);font-family:var(--pixel);font-size:12px;z-index:2;box-shadow:var(--bevel)}
.x-btn:hover{background:var(--red)}
.link-btn{font-size:.82rem;color:var(--muted);text-decoration:underline;margin-right:auto}
.link-btn:hover{color:var(--ink)}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(100%,600px);padding:2rem}
.login-card.wide{width:min(100%,900px)}
.login-hero{text-align:center;margin-bottom:1.8rem}
.login-hero .big-star{width:84px;height:84px;margin:0 auto 1.2rem;display:grid;place-items:center;animation:float 2.4s steps(4) infinite}
.login-hero .big-star svg{width:72px;height:72px;filter:drop-shadow(0 0 14px rgba(255,210,63,.6))}
@keyframes float{50%{transform:translateY(-8px)}}
.login-hero h1{font-size:30px;color:var(--cyan);text-shadow:3px 3px 0 var(--magenta),0 0 24px rgba(59,232,255,.45)}
.login-hero p{margin:.9rem 0 0;color:var(--muted);font-weight:600}
.login-hero .press{font-family:var(--pixel);font-size:10px;color:var(--star);margin-top:1.3rem}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.role-btn{padding:1.2rem 1rem;background:var(--panel-2);border:3px solid var(--line-2);text-align:left;transition:transform .08s steps(2),border-color .1s;display:flex;flex-direction:column;gap:.5rem;box-shadow:var(--hard)}
.role-btn:hover{border-color:var(--cyan);transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(0,0,0,.55),0 0 24px rgba(59,232,255,.2)}
.role-btn .kick{font-family:var(--pixel);font-size:8px;color:var(--magenta)}
.role-btn b{font-family:var(--pixel);font-weight:400;font-size:11px;line-height:1.5}
.role-btn span{font-size:.86rem;color:var(--muted);line-height:1.45}
.role-btn .ico{width:52px;height:52px;display:grid;place-items:center;margin-bottom:.2rem;background:var(--panel-3);border:3px solid var(--edge)}
.demo-note{margin-top:1.5rem;padding:1rem;background:rgba(139,107,255,.12);border:2px dashed var(--violet);color:var(--ink-2);font-size:.84rem;line-height:1.55}
.demo-note b{color:var(--star)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;max-height:58vh;overflow:auto;padding:6px}
.pick{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:.9rem .4rem;background:var(--panel-2);border:3px solid var(--line);transition:transform .08s steps(2),border-color .1s}
.pick:hover{border-color:var(--cyan);transform:translateY(-3px)}
.pick .name{font-family:var(--pixel);font-size:9px;line-height:1.5;text-align:center;word-break:break-word}
.back-link{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--pixel);font-size:9px;color:var(--muted);margin-bottom:1.2rem}
.back-link:hover{color:var(--cyan)}
.pin-wrap{display:flex;flex-direction:column;align-items:center;gap:1.2rem}
.pin-who{display:flex;flex-direction:column;align-items:center;gap:.7rem}
.pin-who b{font-family:var(--pixel);font-weight:400;font-size:14px}
.pin-dots{display:flex;gap:12px;height:20px}
.pin-dots i{width:18px;height:18px;border:3px solid var(--line-2);transition:all .08s}
.pin-dots i.on{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.pin-dots.shake{animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,74px);gap:10px}
.pin-pad button{height:64px;background:var(--panel-3);border:3px solid var(--edge);font-family:var(--pixel);font-size:18px;box-shadow:var(--bevel),0 4px 0 var(--edge)}
.pin-pad button:hover{background:#323a7a}
.pin-pad button:active{transform:translateY(4px);box-shadow:var(--bevel)}
.pin-msg{min-height:1.4em;font-family:var(--pixel);font-size:9px;color:var(--red)}

/* Topbar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;padding:.7rem 1.4rem;background:rgba(40,46,110,.9);backdrop-filter:blur(6px);border-bottom:3px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--pixel);font-size:8px;color:var(--green);border:2px solid var(--green);padding:5px 8px}
.live i{width:8px;height:8px;background:var(--green);animation:blink 1.2s steps(2) infinite}
.star-pill{display:inline-flex;align-items:center;gap:.5rem;padding:7px 10px;background:#4b3c12;color:var(--star);border:3px solid #7a5f0c;font-family:var(--pixel);font-size:12px;box-shadow:0 0 14px rgba(255,210,63,.18)}
.star-pill.bump{animation:bump .4s steps(4)}
@keyframes bump{50%{transform:scale(1.3)}}

/* Lehreransicht */
.t-layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:1.3rem;padding:1.3rem 1.4rem 2rem;align-items:start}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--panel);border:3px solid var(--line);margin-bottom:1.1rem}
.tabs button{padding:10px 14px;font-family:var(--pixel);font-size:10px;color:var(--muted);display:inline-flex;align-items:center;gap:.5rem}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--cyan);color:#04121a;box-shadow:var(--bevel)}
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.1rem}
.stat{display:inline-flex;align-items:center;gap:.5rem;padding:7px 10px;background:var(--panel);border:2px solid var(--line);font-family:var(--pixel);font-size:10px}
.stat i{width:10px;height:10px;display:block}
.toggle{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--pixel);font-size:8px;color:var(--ink-2);cursor:pointer;user-select:none;text-transform:uppercase}
.toggle input{appearance:none;width:40px;height:22px;background:var(--panel-3);border:3px solid var(--edge);position:relative;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--muted);transition:transform .1s steps(2)}
.toggle input:checked{background:var(--violet)}
.toggle input:checked::after{transform:translateX(18px);background:#fff}

.s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.s-card{position:relative;background:var(--panel);border:3px solid var(--line);box-shadow:var(--hard);transition:transform .08s steps(2),border-color .1s}
.s-card:hover{transform:translate(-2px,-2px);border-color:var(--cyan)}
.s-card.a-gelb{border-color:var(--yellow)}
.s-card.a-rot{border-color:var(--red)}
.s-open{width:100%;display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1.1rem .5rem .9rem;text-align:center}
.s-name{font-family:var(--pixel);font-size:9px;line-height:1.5;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-meta{display:flex;align-items:center;gap:.5rem;font-family:var(--pixel);font-size:9px;color:var(--star)}
.s-new{font-family:var(--pixel);font-size:7px;color:var(--muted);border:2px dashed var(--line-2);padding:3px 5px}
.s-quick{position:absolute;top:6px;right:6px;height:28px;padding:0 6px;background:#4b3c12;color:var(--star);font-family:var(--pixel);font-size:8px;display:inline-flex;align-items:center;gap:3px;border:2px solid #7a5f0c;transition:all .08s}
.s-quick:hover{background:var(--star);color:#2a1d00;border-color:var(--edge)}
.help-badge{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font-family:var(--pixel);font-size:7px;padding:5px 6px;border:2px solid var(--edge);z-index:1}
.bday-badge{position:absolute;bottom:6px;right:6px;width:26px;height:26px;z-index:1;animation:float 1.4s steps(2) infinite}
.bday-badge svg{width:100%;height:100%;display:block}
.s-card.is-help{border-color:var(--red);animation:helpBlink .7s steps(2) infinite}
@keyframes helpBlink{0%{background:var(--panel);box-shadow:var(--hard)}50%{background:#4a1220;box-shadow:var(--hard),0 0 26px rgba(255,77,94,.7)}}
.s-grid.discreet .s-card.a-gelb,.s-grid.discreet .s-card.a-rot{border-color:var(--line)}
.s-grid.discreet .s-meta{visibility:hidden}
.float-star{position:fixed;pointer-events:none;z-index:460;font-family:var(--pixel);color:var(--star);font-size:14px;text-shadow:2px 2px 0 #000;animation:floatUp .8s steps(8) forwards}
@keyframes floatUp{to{transform:translateY(-56px);opacity:0}}

.aside{display:flex;flex-direction:column;gap:1.1rem;position:sticky;top:80px;max-height:calc(100vh - 96px)}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:var(--hard);display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;align-items:center;gap:.6rem;padding:1rem 1.1rem .8rem}
.panel-head h2{font-size:11px;color:var(--cyan)}
.panel-head .count{margin-left:auto;font-family:var(--pixel);font-size:9px;background:var(--panel-3);color:var(--ink);padding:4px 7px;border:2px solid var(--edge)}
.panel.help-on{border-color:var(--red);box-shadow:var(--hard),0 0 30px rgba(255,77,94,.35)}
.panel.help-on h2{color:var(--red)}
.panel.help-on .count{background:var(--red);color:#fff}
.help-list{padding:0 .8rem .8rem;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
.help-item{display:flex;align-items:center;gap:.7rem;padding:.6rem;background:var(--red-soft);border:2px solid var(--red);animation:pop .2s steps(3)}
.help-item b{display:block;font-family:var(--pixel);font-weight:400;font-size:9px;margin-bottom:4px}
.help-item small{color:#ffb3ba;font-weight:600;font-size:.78rem}
.help-item .btn{margin-left:auto}
.feed-panel{flex:1;min-height:320px}
.feed-filter{display:flex;gap:6px;flex-wrap:wrap;padding:0 1.1rem .8rem}
.feed-filter .chip{font-size:.75rem;padding:5px 8px}
.feed{flex:1;overflow:auto;padding:.8rem .9rem 1rem;display:flex;flex-direction:column;gap:10px;min-height:200px;border-top:3px solid var(--line);background:rgba(22,26,70,.35)}
.msg{align-self:flex-start;max-width:94%;background:var(--panel-2);border:2px solid var(--line-2);padding:.6rem .8rem .55rem;position:relative}
.msg.new{animation:msgIn .3s steps(4)}
@keyframes msgIn{from{opacity:0;transform:translateX(-12px)}}
.msg p{margin:.35rem 0 .1rem;line-height:1.45;font-size:.92rem;white-space:pre-wrap;word-break:break-word}
.msg-top{display:flex;align-items:center;gap:.5rem;font-size:.72rem;color:var(--muted);font-weight:600}
.msg-del{margin-left:auto;opacity:0;font-size:.95rem;color:var(--muted);width:22px;height:22px}
.msg:hover .msg-del{opacity:1}
.msg-del:hover{background:var(--red);color:#fff}
.tag{display:inline-flex;align-items:center;font-family:var(--pixel);font-size:7px;padding:4px 6px;text-transform:uppercase;border:2px solid currentColor}
.tag-unklar,.tag-probe{color:var(--red);background:var(--red-soft)}
.tag-gut{color:var(--green);background:var(--green-soft)}
.tag-idee,.tag-hausaufgabe{color:#b9a6ff;background:var(--brand-soft)}
.tag-sonstiges{color:var(--ink-2);background:var(--panel-3)}
.tag-termin{color:var(--cyan);background:var(--teal-soft)}
.tag-geburtstag{color:var(--pink);background:var(--pink-soft)}

/* Geburtstage */
.bday-panel .panel-head h2{color:var(--pink)}
.bday-list{display:flex;flex-direction:column;gap:8px;padding:0 .9rem .9rem}
.bday{display:flex;align-items:center;gap:.7rem;padding:.5rem .6rem;background:var(--panel-2);border:2px solid var(--line-2)}
.bday.today{border-color:var(--pink);background:var(--pink-soft);box-shadow:0 0 18px rgba(255,122,217,.35)}
.bday.past{opacity:.45}
.bday .bd-date{font-family:var(--pixel);font-size:9px;color:var(--pink);width:44px;flex:none}
.bday .bd-name{font-weight:700;font-size:.92rem;flex:1;min-width:0}
.bday .bd-rel{font-family:var(--pixel);font-size:7px;color:var(--muted);white-space:nowrap}
.bday.today .bd-rel{color:var(--pink);animation:blink 1s steps(2) infinite}
.bday-month{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.bday-month h2{color:var(--pink)}
.bday-sel{display:grid;grid-template-columns:1fr 1.6fr;gap:.6rem}
.bday-hero{text-align:center;margin-bottom:1rem}
.bday-hero svg{width:72px;height:72px;margin:0 auto .6rem;display:block}
.bday-banner{grid-column:1/-1;display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;background:linear-gradient(90deg,rgba(255,122,217,.25),rgba(139,107,255,.2));border:3px solid var(--pink);box-shadow:var(--hard)}
.bday-banner svg{width:48px;height:48px;flex:none}
.bday-banner b{font-family:var(--pixel);font-weight:400;font-size:12px;color:#fff;line-height:1.6}

/* Termine */
.ev-layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:1.1rem;align-items:start}
.ev-form{padding:1.3rem}
.ev-form h2{margin-bottom:1rem;color:var(--cyan)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#2a3274;border:3px solid var(--line);margin-bottom:.9rem}
.seg button{padding:9px 4px;font-family:var(--pixel);font-size:8px;color:var(--muted)}
.seg button.on{background:var(--violet);color:#fff;box-shadow:var(--bevel)}
.ev-list{display:flex;flex-direction:column;gap:10px}
.ev{display:flex;gap:.9rem;align-items:center;padding:.75rem .9rem;background:var(--panel-2);border:2px solid var(--line-2)}
.ev.past{opacity:.5}
.ev-date{width:58px;flex:none;text-align:center;padding:.5rem 0;border:2px solid currentColor;background:rgba(0,0,0,.25)}
.ev-date b{display:block;font-family:var(--pixel);font-weight:400;font-size:16px;line-height:1.2}
.ev-date small{font-family:var(--pixel);font-size:7px;text-transform:uppercase}
.ev-hausaufgabe .ev-date{color:#b9a6ff}
.ev-probe .ev-date{color:var(--red)}
.ev-termin .ev-date{color:var(--cyan)}
.ev-geburtstag .ev-date{color:var(--pink)}
.ev-geburtstag{border-color:rgba(255,122,217,.5)}
.ev-body{flex:1;min-width:0}
.ev-body .t{font-weight:700;line-height:1.35}
.ev-body .d{font-size:.84rem;color:var(--ink-2);margin-top:.2rem;line-height:1.45;white-space:pre-wrap}
.ev-body .m{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;margin-bottom:.35rem;font-size:.76rem;font-weight:700;color:var(--muted)}
.rel{font-family:var(--pixel);font-size:7px;color:var(--ink-2)}
.rel.soon{color:var(--red);animation:blink 1.2s steps(2) infinite}
.ev-actions{display:flex;gap:4px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;color:var(--muted);font-size:1rem;border:2px solid transparent}
.icon-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.icon-btn.del:hover{border-color:var(--red);color:var(--red)}
.sec-title{display:flex;align-items:center;gap:.6rem;margin:1.3rem 0 .7rem}
.sec-title h3{color:var(--cyan)}

/* Einstellungen */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1.1rem;align-items:start}
.set-card{padding:1.3rem}
.set-card h2{color:var(--cyan);margin-bottom:.5rem}
.set-card>p{color:var(--ink-2);font-size:.88rem;line-height:1.55;margin:.2rem 0 1rem}
.set-card.danger{border-color:var(--red)}
.set-card.danger h2{color:var(--red)}
.pin-table{width:100%;border-collapse:collapse;font-size:.88rem}
.pin-table td{padding:.45rem .3rem;border-bottom:2px solid var(--line)}
.pin-table td:last-child{text-align:right}
.pin-table code,.pin-code{font-family:var(--pixel);font-size:10px;letter-spacing:.15em;background:#2a3274;color:var(--cyan);padding:5px 7px;border:2px solid var(--line-2)}
.pin-scroll{max-height:300px;overflow:auto;margin-bottom:.9rem}
.check{display:flex;gap:.6rem;align-items:flex-start;font-size:.9rem;margin-bottom:.55rem;line-height:1.4}
.check input{margin-top:.15rem;accent-color:var(--red);width:16px;height:16px}

/* Drawer */
.dr-head{display:flex;gap:1rem;align-items:center;padding:1.4rem 1.5rem 1.1rem;border-bottom:3px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.dr-head h2{font-size:15px}
.dr-head .row{margin-top:.6rem}
.dr-sec{padding:1.2rem 1.5rem;border-bottom:3px solid var(--line)}
.dr-sec h3{margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem;color:var(--cyan)}
.ampel-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:.8rem}
.ampel-pick button{padding:12px 6px;border:3px solid var(--line-2);font-family:var(--pixel);font-size:9px;display:flex;flex-direction:column;align-items:center;gap:.6rem;background:var(--panel-2)}
.ampel-pick button i{width:22px;height:22px;display:block;border:3px solid var(--edge)}
.ampel-pick button[data-level=gruen] i{background:var(--green)}
.ampel-pick button[data-level=gelb] i{background:var(--yellow)}
.ampel-pick button[data-level=rot] i{background:var(--red)}
.ampel-pick button.on[data-level=gruen]{border-color:var(--green);box-shadow:0 0 18px rgba(61,255,139,.35)}
.ampel-pick button.on[data-level=gelb]{border-color:var(--yellow);box-shadow:0 0 18px rgba(255,210,63,.35)}
.ampel-pick button.on[data-level=rot]{border-color:var(--red);box-shadow:0 0 18px rgba(255,77,94,.35)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.7rem}
.presets .chip{font-size:.76rem}
.log{list-style:none;margin:.9rem 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto}
.log li{display:flex;gap:.6rem;align-items:flex-start;font-size:.84rem;line-height:1.4;padding:.5rem .6rem;background:#2a3274;border-left:3px solid var(--line-2)}
.log li .when{color:var(--muted);font-weight:600;white-space:nowrap;font-size:.76rem;margin-left:auto;padding-left:.4rem}
.dot{width:10px;height:10px;flex:none;margin-top:.3rem}
.dot.gruen{background:var(--green)}.dot.gelb{background:var(--yellow)}.dot.rot{background:var(--red)}
.help-alert{margin:1rem 1.5rem 0;padding:.8rem 1rem;background:var(--red-soft);border:2px solid var(--red);color:#ffb3ba;font-family:var(--pixel);font-size:9px;line-height:1.5;display:flex;align-items:center;gap:.8rem}
.help-alert .btn{margin-left:auto}

/* Mission */
.mission{padding:1.2rem 1.3rem 1.1rem;margin-bottom:1.1rem;border-color:var(--violet);background:linear-gradient(100deg,rgba(139,107,255,.22),rgba(255,79,216,.06) 60%,transparent),var(--panel);position:relative;overflow:hidden}
.mission.won{border-color:var(--star);background:linear-gradient(100deg,rgba(255,210,63,.2),transparent 70%),var(--panel)}
.mission.failed{border-color:var(--line-2)}
.m-top{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.m-kicker{font-family:var(--pixel);font-size:8px;color:var(--magenta);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.6rem}
.m-title{font-size:15px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.m-desc{margin:.5rem 0 0;color:var(--ink-2);font-size:.9rem;line-height:1.5}
.m-status{font-family:var(--pixel);font-size:9px;padding:6px 8px;border:2px solid var(--cyan);color:var(--cyan);white-space:nowrap}
.m-status.won{border-color:var(--star);color:var(--star);animation:blink 1s steps(2) infinite}
.m-status.failed{border-color:var(--muted);color:var(--muted)}
.m-status.last{border-color:var(--red);color:var(--red);animation:blink 1s steps(2) infinite}
.m-track{position:relative;height:30px;margin:1.6rem 56px .9rem 0;background:#232a66;border:3px solid var(--edge);box-shadow:0 0 0 2px var(--line-2)}
.m-fill{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--cyan) 0 12px,#1aa9c9 12px 15px);box-shadow:0 0 16px rgba(59,232,255,.5);transition:width .9s steps(10)}
.m-track.won .m-fill{background:repeating-linear-gradient(90deg,var(--star) 0 12px,#d9a400 12px 15px);box-shadow:0 0 20px rgba(255,210,63,.6)}
.m-track.failed .m-fill{background:repeating-linear-gradient(90deg,#5d6499 0 12px,#474d7d 12px 15px);box-shadow:none}
.m-rocket{position:absolute;top:50%;width:54px;transform:translate(-60%,-50%);transition:left .9s steps(10);filter:drop-shadow(0 0 6px rgba(255,157,61,.7))}
.m-rocket svg{display:block;width:100%}
.m-track.active .m-rocket{animation:shake2 .3s steps(2) infinite}
@keyframes shake2{50%{margin-top:-2px}}
.m-planet{position:absolute;right:-58px;top:50%;width:50px;transform:translateY(-50%)}
.m-planet svg{display:block;width:100%}
.m-nums{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;font-family:var(--pixel);font-size:10px;color:var(--star)}
.m-nums span{color:var(--ink-2)}
.m-nums .mine{margin-left:auto;color:var(--cyan)}
.m-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;align-items:center}
.m-actions .hint{margin:0 0 0 auto}
.m-empty{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.m-empty .hint{max-width:520px}
.m-donate{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:1rem;padding-top:1rem;border-top:2px dashed var(--line-2)}
.m-donate .hint{flex:1;min-width:200px;margin:0}

.celebrate{position:fixed;inset:0;z-index:420;display:grid;place-items:center;background:rgba(3,4,12,.82);animation:fade .2s}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%}
.cel-box{position:relative;text-align:center;padding:2.2rem 2.4rem;background:var(--panel);border:4px solid var(--star);box-shadow:10px 10px 0 #000,0 0 80px rgba(255,210,63,.45);max-width:min(92vw,560px)}
.cel-title{font-size:30px;color:var(--star);text-shadow:4px 4px 0 var(--magenta);margin:.4rem 0 1rem;animation:blink 1s steps(2) infinite}
.cel-box p{font-size:1.1rem;font-weight:700;margin:0 0 1.2rem;line-height:1.5}
.cel-ship{width:120px;margin:0 auto 1.4rem;animation:float 1.2s steps(4) infinite}
.cel-ship svg{width:100%;display:block}

/* Schüleransicht */
.st-main{max-width:1160px;margin:0 auto;padding:1.3rem 1.2rem 3rem;display:grid;grid-template-columns:repeat(12,1fr);gap:1.1rem}
.st-card{padding:1.3rem}
.st-card h2{display:flex;align-items:center;gap:.6rem;color:var(--cyan);flex-wrap:wrap}
.st-card .sub{color:var(--muted);font-size:.86rem;margin:.6rem 0 1rem;line-height:1.5}
.st-hero{grid-column:span 5;display:flex;align-items:center;gap:1.3rem;background:linear-gradient(135deg,#5634b0 0%,#2d47a8 100%);border-color:var(--violet);overflow:hidden;position:relative}
.st-hero::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,79,216,.35),transparent 70%);pointer-events:none}
.st-hero .hello{font-family:var(--pixel);font-size:8px;color:var(--magenta)}
.st-hero h1{font-size:18px;margin:.6rem 0 .9rem;color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.5);word-break:break-word}
.st-hero .av{border:4px solid var(--edge);box-shadow:0 0 0 3px var(--cyan),0 0 30px rgba(59,232,255,.35);cursor:pointer;transition:transform .1s steps(2)}
.st-hero .av:hover{transform:translateY(-4px)}
.st-hero .btn{position:relative;z-index:1}
.st-hero .earned{font-size:.8rem;color:var(--ink-2);margin-top:.8rem;font-weight:600}
.afford{display:block;margin-top:.7rem;font-family:var(--pixel);font-size:8px;line-height:1.6;color:var(--star);animation:blink 1.2s steps(2) infinite}
.st-help{grid-column:span 4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.9rem}
.st-ampel{grid-column:span 3}
.st-mission{grid-column:span 12}
.st-events{grid-column:span 7}
.st-feedback{grid-column:span 5}
.st-bday{grid-column:span 4}
.st-log{grid-column:span 8}
.panic{width:172px;height:172px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8c96 0%,#ff4d5e 42%,#b3122a 100%);color:#fff;border:6px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 0 #5c0614,0 10px 0 6px var(--edge),0 0 40px rgba(255,77,94,.35),inset 0 -8px 0 rgba(0,0,0,.2),inset 0 8px 0 rgba(255,255,255,.25);transition:transform .05s steps(1);position:relative;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.panic .p-big{font-family:var(--pixel);font-size:26px}
.panic .p-small{font-family:var(--pixel);font-size:8px;line-height:1.5;max-width:120px}
.panic:hover{filter:brightness(1.08)}
.panic:active,.panic.active{transform:translateY(8px);box-shadow:0 2px 0 #5c0614,0 2px 0 6px var(--edge),0 0 50px rgba(255,77,94,.6),inset 0 -8px 0 rgba(0,0,0,.2)}
.panic.active::before{content:"";position:absolute;inset:-16px;border-radius:50%;border:4px dashed var(--red);animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.panic-state{font-size:.9rem;font-weight:600;color:var(--ink-2);min-height:2.6em;line-height:1.45}
.panic-state.on{color:#ffb3ba}
.panic-state a{color:var(--cyan)}
.traffic{display:flex;gap:1.1rem;align-items:center}
.traffic-box{background:#05060f;padding:8px;display:flex;flex-direction:column;gap:7px;flex:none;border:3px solid #2a2f5c}
.traffic-box i{width:30px;height:30px;background:#20244a;display:block;transition:all .2s steps(2)}
.traffic-box i.r.on{background:var(--red);box-shadow:0 0 18px var(--red)}
.traffic-box i.y.on{background:var(--yellow);box-shadow:0 0 18px var(--yellow)}
.traffic-box i.g.on{background:var(--green);box-shadow:0 0 18px var(--green)}
.traffic b{font-family:var(--pixel);font-weight:400;font-size:10px;line-height:1.6;display:block;margin-bottom:.5rem}
.traffic .note{font-size:.9rem;line-height:1.45;color:var(--ink-2)}
.traffic .when{font-size:.75rem;color:var(--muted);margin-top:.5rem;font-weight:600}
.fb-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.8rem}
.fb-foot{display:flex;align-items:center;gap:.6rem;margin-top:.7rem}
.fb-foot small{color:var(--muted);font-family:var(--pixel);font-size:8px}
.anon{display:inline-flex;align-items:center;font-family:var(--pixel);font-size:7px;color:var(--green);border:2px solid var(--green);padding:4px 6px;text-transform:uppercase}
.starlog{display:flex;gap:8px;flex-wrap:wrap}
.starlog .sl{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:#4b3c12;border:2px solid #7a5f0c;font-size:.85rem;font-weight:600;color:var(--star)}
.starlog .sl.minus{background:var(--panel-2);border-color:var(--line-2);color:var(--ink-2)}
.starlog .sl small{color:var(--muted);font-weight:600}

/* Garderobe */
.wd{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:580px}
.wd-preview{background:linear-gradient(180deg,#4a33a0,#2a3d94);padding:1.6rem 1.3rem;display:flex;flex-direction:column;align-items:center;gap:1.1rem;border-right:3px solid var(--line)}
.wd-preview h2{text-align:center;color:var(--cyan);text-shadow:2px 2px 0 var(--magenta)}
.wd-preview .av{border:4px solid var(--edge);box-shadow:0 0 0 3px var(--cyan),0 0 40px rgba(59,232,255,.3)}
.wd-try{background:rgba(0,0,0,.3);border:2px dashed var(--line-2);padding:.9rem;text-align:center;font-size:.86rem;line-height:1.5;width:100%;color:var(--ink-2)}
.wd-try b{display:block;font-family:var(--pixel);font-weight:400;font-size:9px;line-height:1.6;color:var(--ink);margin-bottom:.4rem}
.wd-try .btn{margin-top:.8rem;width:100%}
.wd-main{display:flex;flex-direction:column;min-width:0}
.wd-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:1.2rem 3.6rem .9rem 1.2rem;border-bottom:3px solid var(--line)}
.wd-items{padding:1rem 1.2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;align-content:start;overflow:auto;flex:1;max-height:56vh}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.8rem .4rem .7rem;background:var(--panel-2);border:3px solid var(--line);transition:transform .08s steps(2),border-color .1s;text-align:center}
.item:hover{border-color:var(--ink-2);transform:translateY(-3px)}
.item.on{border-color:var(--cyan);box-shadow:0 0 18px rgba(59,232,255,.35)}
.item.locked .av{filter:saturate(.75) brightness(.95)}
.item .nm{font-weight:700;font-size:.82rem;line-height:1.2}
.item .pr{font-family:var(--pixel);font-size:8px;display:inline-flex;align-items:center;gap:.3rem}
.item .pr.own{color:var(--green)}
.item .pr.lock{color:var(--star)}
.rar{position:absolute;top:5px;left:5px;z-index:1;font-family:var(--pixel);font-size:6px;padding:3px 4px;text-transform:uppercase;border:2px solid var(--edge)}
.rar-normal{background:#596089;color:#fff}
.rar-selten{background:#1d8fd6;color:#fff}
.rar-episch{background:#9b3df5;color:#fff}
.rar-legendaer{background:var(--star);color:#2a1d00;box-shadow:0 0 10px rgba(255,210,63,.7)}
.swatch{width:62px;height:62px;border:3px solid var(--edge);box-shadow:0 0 0 2px var(--line-2)}
.none-ico{width:62px;height:62px;display:grid;place-items:center;background:#2a3274;border:3px dashed var(--line-2);color:var(--muted);font-family:var(--pixel);font-size:14px}
.wd-foot{display:flex;gap:.7rem;justify-content:flex-end;padding:1rem 1.2rem;border-top:3px solid var(--line);align-items:center}
.wd-foot small{color:var(--muted);font-size:.8rem;margin-right:auto;line-height:1.4}

.banner{background:var(--violet);color:#fff;font-family:var(--pixel);font-size:8px;line-height:1.8;text-align:center;padding:.6rem 1rem;display:flex;align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap}
.banner b{color:var(--star);font-weight:400}

/* Responsive */
@media (max-width:1180px){
  .t-layout{grid-template-columns:1fr}
  .aside{position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr}
  .feed{max-height:420px}
}
@media (max-width:900px){
  .st-main{grid-template-columns:1fr}
  .st-main>*{grid-column:1/-1!important}
  .ev-layout{grid-template-columns:1fr}
  .wd{grid-template-columns:1fr}
  .wd-preview{flex-direction:row;flex-wrap:wrap;justify-content:center;border-right:0;border-bottom:3px solid var(--line)}
  .wd-items{max-height:none}
}
@media (max-width:720px){
  h1{font-size:20px}
  .aside{grid-template-columns:1fr}
  .topbar{padding:.6rem .8rem;gap:.6rem}
  .brand{font-size:11px}
  .t-layout{padding:1rem .8rem 2rem}
  .role-grid{grid-template-columns:1fr}
  .login-hero h1{font-size:20px}
  .st-hero{flex-direction:column;text-align:center}
  .hide-sm{display:none!important}
  .m-title{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .s-card.is-help{background:#4a1220;box-shadow:0 0 0 4px var(--red)}
}

/* Druck (PIN-Karten) */
#print-area{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff;color:#000}
  body::after,#starfield{display:none!important}
  body.print-pins #app,body.print-pins #modal-root,body.print-pins #toasts{display:none!important}
  body.print-pins #print-area{display:block}
  .pin-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
  .pin-card{border:1px dashed #999;padding:8mm 6mm;break-inside:avoid;font-family:var(--font)}
  .pin-card .n{font-size:15pt;font-weight:700;margin-bottom:2mm}
  .pin-card .p{font-family:var(--pixel);font-size:18pt;letter-spacing:.15em}
  .pin-card .i{font-size:8pt;color:#555;margin-top:2mm;line-height:1.35}
  .print-head{font-size:11pt;margin-bottom:5mm;color:#333}
}

.st-main .mission{margin-bottom:0}

/* ---------- Heller Weltraum ---------- */
:root{--bg:#2a3176;--panel:#353f8f;--panel-2:#3f4a9f;--panel-3:#4d59b3;--paper:#353f8f;--line:#5b68c8;--line-2:#7887e0;--muted:#bcc3f3;--ink-2:#e4e8ff;--edge:#191d4a;--hard:5px 5px 0 rgba(18,20,56,.45)}
html{background:#2a3176}
body{background:radial-gradient(1200px 700px at 85% -10%,rgba(255,122,217,.38),transparent 60%),radial-gradient(1000px 700px at -10% 110%,rgba(59,232,255,.28),transparent 60%),linear-gradient(180deg,#2e3380 0%,#3d3289 100%);background-attachment:fixed}

/* ---------- Ampel: rund und glänzend statt Pixel ---------- */
.ampel-mini{border-radius:999px;background:linear-gradient(#3a3e5c,#1b1d33);border:1px solid #11132a;padding:3px 6px;gap:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.ampel-mini i{width:9px;height:9px;border-radius:50%;background:#4a4e72}
.ampel-mini i.g.on{background:radial-gradient(circle at 35% 30%,#d4ffe6,#22d16b 65%);box-shadow:0 0 8px #3dff8b}
.ampel-mini i.y.on{background:radial-gradient(circle at 35% 30%,#fff6cc,#f5c400 65%);box-shadow:0 0 8px #ffd23f}
.ampel-mini i.r.on{background:radial-gradient(circle at 35% 30%,#ffd6da,#f0283c 65%);box-shadow:0 0 8px #ff4d5e}
.traffic-box{border-radius:18px;background:linear-gradient(180deg,#3b3f5e,#1a1c33);border:2px solid #11132a;padding:10px 9px;gap:9px;box-shadow:0 10px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.traffic-box i{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555a80,#2a2d48);box-shadow:inset 0 2px 5px rgba(0,0,0,.55)}
.traffic-box i.r.on{background:radial-gradient(circle at 35% 30%,#ffe0e3,#ff4d5e 45%,#b8142a);box-shadow:0 0 24px #ff4d5e,inset 0 -3px 5px rgba(0,0,0,.25)}
.traffic-box i.y.on{background:radial-gradient(circle at 35% 30%,#fff8d6,#ffd23f 45%,#c99400);box-shadow:0 0 24px #ffd23f,inset 0 -3px 5px rgba(0,0,0,.2)}
.traffic-box i.g.on{background:radial-gradient(circle at 35% 30%,#e0ffee,#3dff8b 45%,#0f9c48);box-shadow:0 0 24px #3dff8b,inset 0 -3px 5px rgba(0,0,0,.2)}
.traffic b{font-family:var(--font);font-weight:800;font-size:1.05rem;line-height:1.35}
.ampel-pick button{font-family:var(--font);font-weight:800;font-size:.9rem;border-radius:14px}
.ampel-pick button i{border-radius:50%;border:2px solid rgba(0,0,0,.35);width:26px;height:26px}
.ampel-pick button[data-level=gruen] i{background:radial-gradient(circle at 35% 30%,#e0ffee,#3dff8b 50%,#0f9c48)}
.ampel-pick button[data-level=gelb] i{background:radial-gradient(circle at 35% 30%,#fff8d6,#ffd23f 50%,#c99400)}
.ampel-pick button[data-level=rot] i{background:radial-gradient(circle at 35% 30%,#ffe0e3,#ff4d5e 50%,#b8142a)}
.stat i,.dot{border-radius:50%}

/* ---------- Was steht an: geteilt ---------- */
.st-events{grid-column:span 12}
.st-feedback{grid-column:span 7}
.st-bday{grid-column:span 5}
.st-log{grid-column:span 12}
.st-ach{grid-column:span 12}
.ev-split{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.ev-col{background:rgba(20,24,70,.25);border:2px solid var(--line);padding:.9rem;min-width:0}
.ev-col-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;padding-bottom:.7rem;border-bottom:2px dashed var(--line-2)}
.ev-col-head h3{font-size:10px}
.ev-col-head.hw h3{color:#c9b8ff}
.ev-col-head.dt h3{color:var(--cyan)}
.ev-col-head .count{margin-left:auto;font-family:var(--pixel);font-size:9px;background:var(--panel-3);padding:4px 7px;border:2px solid var(--edge)}
@media (max-width:720px){.ev-split{grid-template-columns:1fr}}

/* ---------- Erfolge ---------- */
.ach-count{font-family:var(--pixel);font-size:10px;color:var(--star);margin-left:auto}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ach{display:flex;gap:.8rem;align-items:flex-start;padding:.75rem;background:var(--panel-2);border:2px solid var(--line);opacity:.6;filter:saturate(.3)}
.ach.on{opacity:1;filter:none;border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.ach-ico{width:46px;height:46px;flex:none;display:grid;place-items:center;background:rgba(10,12,40,.35);border:2px solid var(--c);color:var(--c)}
.ach-ico svg{width:30px;height:30px;display:block}
.ach-ico b{font-family:var(--pixel);font-weight:400;font-size:16px;color:var(--muted)}
.ach-ico.sm{width:36px;height:36px}
.ach-ico.sm svg{width:22px;height:22px}
.ach-txt{min-width:0}
.ach-txt b{display:block;font-family:var(--pixel);font-weight:400;font-size:9px;line-height:1.5;margin-bottom:.3rem}
.ach-txt small{display:block;font-size:.78rem;color:var(--ink-2);line-height:1.4}
.ach-bar{display:block;height:8px;background:rgba(10,12,40,.4);border:2px solid var(--edge);margin:.45rem 0 .25rem}
.ach-bar i{display:block;height:100%;background:var(--c)}
.ach-txt .ach-n{font-family:var(--pixel);font-size:7px;color:var(--muted)}
.ach-txt .ach-rew{color:var(--star);font-weight:700;margin-top:.3rem}
.ach-txt .ach-priv{color:var(--green);margin-top:.3rem}
.ach-mini{display:flex;flex-wrap:wrap;gap:6px}
.ach-pop{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:470;display:flex;gap:1rem;align-items:center;padding:1rem 1.3rem;background:var(--panel);border:3px solid var(--c);box-shadow:8px 8px 0 rgba(0,0,0,.45),0 0 40px color-mix(in srgb,var(--c) 50%,transparent);width:min(92vw,420px);animation:achIn .35s steps(5)}
.ach-pop.out{animation:toastOut .3s steps(3) forwards}
.ach-pop .ach-ico{width:62px;height:62px}
.ach-pop .ach-ico svg{width:42px;height:42px}
.ach-pop b{display:block;font-family:var(--pixel);font-weight:400;font-size:12px;margin:.1rem 0 .45rem;color:#fff;line-height:1.5}
.ach-pop small{color:var(--ink-2);font-size:.86rem;line-height:1.4}
@keyframes achIn{from{opacity:0;transform:translate(-50%,-30px)}}
.rar-erfolg{background:linear-gradient(135deg,#3be8ff,#ff4fd8);color:#fff}
.st-hero .nick-link{display:block;margin:-.5rem 0 .8rem;font-size:.78rem;color:var(--ink-2);position:relative;z-index:1}
.live.off{color:var(--red);border-color:var(--red)}
.live.off i{background:var(--red);animation:none}
.code-input{text-align:center;font-family:var(--pixel);font-size:18px;letter-spacing:.2em;text-transform:uppercase;max-width:280px}
@keyframes flash{0%,100%{box-shadow:var(--hard)}50%{box-shadow:var(--hard),0 0 0 6px var(--red),0 0 40px rgba(255,77,94,.6)}}
.set-card.flash{animation:flash .6s steps(2) 3}

/* Datum und Zeit */
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const parseDate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const dayDiff = s => Math.round((parseDate(s) - today0()) / 864e5);
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const MON = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const fmtDate = s => { const d = parseDate(s); return `${WD[d.getDay()]}, ${d.getDate()}.${d.getMonth() + 1}.`; };
const relDay = n => n < 0 ? 'vorbei' : n === 0 ? 'heute' : n === 1 ? 'morgen' : n === 2 ? 'übermorgen' : `in ${n} Tagen`;
const clock = ts => new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const ago = ts => {
  const s = (Date.now() - ts) / 1000;
  if (s < 45) return 'gerade eben';
  if (s < 3600) return `vor ${Math.max(1, Math.round(s / 60))} Min.`;
  if (s < 86400) return `vor ${Math.round(s / 3600)} Std.`;
  const d = new Date(ts);
  return `${d.getDate()}.${d.getMonth() + 1}., ${clock(ts)}`;
};
const since = ts => { const m = Math.floor((Date.now() - ts) / 60000); return m < 1 ? 'gerade eben' : `seit ${m} Min.`; };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

/* Testdaten mit Platzhaltern bekommen einmalig die echten Namen */
function applyLocalNames(s) {
  const names = localNames();
  if (!names || !s.students.every(st => /^Schüler \d{2}$/.test(st.name))) return false;
  names.forEach((n, i) => { if (s.students[i]) s.students[i].name = n; else s.students.push(newStudent(n)); });
  s.students = s.students.slice(0, names.length);
  return true;
}
/* PINs aus namen.local.js, damit Testmodus und Zugangskarten übereinstimmen */
function applyLocalPins(s) {
  const pins = window.STERNSTUNDE_PINS;
  if (!pins || typeof pins !== 'object') return false;
  const sig = Object.values(pins).join('');
  if (s.settings.localPins === sig) return false;
  s.students.forEach(st => { if (/^\d{4}$/.test(pins[st.name] || '')) st.pin = pins[st.name]; });
  s.settings.localPins = sig;
  return true;
}
function defaultState() {
  return {
    version: 1,
    settings: { className: '9m', schoolYear: '2026/27', teacherPin: '0000', teacherLabel: '' },
    students: (localNames() || Array.from({ length: 24 }, (_, i) => `Schüler ${String(i + 1).padStart(2, '0')}`)).map(n => newStudent(n)),
    feedback: [],
    events: [],
    goal: null,
    goalHistory: []
  };
}
function normalize(s) {
  const d = defaultState();
  if (!s || typeof s !== 'object' || !Array.isArray(s.students)) return d;
  s.settings = Object.assign(d.settings, s.settings || {});
  s.feedback = Array.isArray(s.feedback) ? s.feedback : [];
  s.events = Array.isArray(s.events) ? s.events : [];
  s.goal = s.goal && typeof s.goal === 'object' && s.goal.id ? Object.assign({ progress: 0, bonus: 0, donated: 0, contrib: {}, wonAt: null, details: '' }, s.goal) : null;
  s.goalHistory = Array.isArray(s.goalHistory) ? s.goalHistory : [];
  s.students = s.students.map(st => {
    const base = newStudent(st.name || 'Ohne Namen');
    const merged = Object.assign(base, st);
    merged.avatar = Object.assign(defaultAvatar(), st.avatar || {});
    ['ampelHistory', 'starLog', 'owned', 'loginDays'].forEach(k => { if (!Array.isArray(merged[k])) merged[k] = []; });
    ['achievements', 'flags'].forEach(k => { if (!merged[k] || typeof merged[k] !== 'object' || Array.isArray(merged[k])) merged[k] = {}; });
    if (!AMPEL[merged.ampel]) merged.ampel = 'gruen';
    return merged;
  });
  return s;
}

/* =========================================================
   Server-Anbindung (Supabase)
   Ohne Eintrag in config.js läuft alles lokal im Browser (Testmodus).
   ========================================================= */
const CFG = window.STERNSTUNDE_CONFIG || {};
const REMOTE = !!(CFG.supabaseUrl && CFG.supabaseKey);
const CODE_KEY = 'sternstunde.code';

async function rpc(fn, args) {
  const headers = { 'Content-Type': 'application/json', apikey: CFG.supabaseKey };
  /* Alte anon-Keys sind JWTs und dürfen zusätzlich als Bearer mit, neue sb_publishable-Keys nicht */
  if (/^eyJ/.test(CFG.supabaseKey)) headers.Authorization = 'Bearer ' + CFG.supabaseKey;
  let r;
  try {
    r = await fetch(CFG.supabaseUrl.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers, body: JSON.stringify(args || {}) });
  } catch (e) { const err = new Error('offline'); err.code = 'offline'; throw err; }
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!r.ok) { const msg = data && data.message ? data.message : 'http'; const err = new Error(msg); err.code = msg; throw err; }
  return data;
}

function fromServer(d) {
  const s = normalize({
    version: 1,
    settings: Object.assign({}, d.meta.settings || {}),
    students: d.students || [],
    feedback: d.feedback || [],
    events: d.events || [],
    goal: d.meta.goal || null,
    goalHistory: d.meta.goalHistory || []
  });
  s._role = d.role; s._me = d.me || null; s._metaV = d.meta.version; s._sync = d.sync; s._classCode = d.meta.classCode || '';
  return s;
}

const J = x => JSON.stringify(x);
function diffById(before, after) {
  const b = new Map(before.map(x => [x.id, x]));
  const a = new Set(after.map(x => x.id));
  return {
    changed: after.filter(x => !b.has(x.id) || J(b.get(x.id)) !== J(x)),
    added: after.filter(x => !b.has(x.id)),
    removed: before.filter(x => !a.has(x.id)).map(x => x.id)
  };
}
/* Was hat sich geändert? Daraus wird genau eine Server-Anfrage. */
function buildPatch(before, after) {
  const p = {};
  if (after._role === 'teacher') {
    const order = new Map(before.students.map((x, i) => [x.id, i]));
    const st = diffById(before.students, after.students);
    const ids = new Set(st.changed.map(x => x.id));
    after.students.forEach((x, i) => { if (order.get(x.id) !== i) ids.add(x.id); });
    if (ids.size) p.students = after.students.map((x, i) => [x, i]).filter(([x]) => ids.has(x.id)).map(([x, i]) => Object.assign({}, x, { _sort: i }));
    if (st.removed.length) p.deleteStudents = st.removed;
    const ev = diffById(before.events, after.events);
    if (ev.changed.length) p.events = ev.changed;
    if (ev.removed.length) p.deleteEvents = ev.removed;
    const fb = diffById(before.feedback, after.feedback);
    if (!after.feedback.length && before.feedback.length) p.clearFeedback = true;
    else if (fb.removed.length) p.deleteFeedback = fb.removed;
    if (fb.added.length) p.addFeedback = fb.added.map(f => ({ cat: f.cat, text: f.text }));
    if (J(before.settings) !== J(after.settings) || J(before.goal) !== J(after.goal) || J(before.goalHistory) !== J(after.goalHistory)) {
      p.meta = { settings: after.settings, goal: after.goal, goalHistory: after.goalHistory, _v: after._metaV };
    }
  } else {
    const b = before.students.find(x => x.id === after._me), a = after.students.find(x => x.id === after._me);
    if (a && J(a) !== J(b)) p.self = a;
    const fb = diffById(before.feedback, after.feedback);
    if (fb.added.length) p.feedback = fb.added.map(f => ({ cat: f.cat, text: f.text }));
  }
  return Object.keys(p).length ? p : null;
}

function setOnline(ok) {
  $$('.live').forEach(l => { l.classList.toggle('off', !ok); if (l.lastChild) l.lastChild.textContent = ok ? 'Live' : 'Offline'; });
}
function serverError(e) {
  if (e.code === 'auth') { toast('Sitzung abgelaufen. Bitte neu anmelden.', 'bad'); setSession(null, true); return; }
  if (e.code === 'offline') { setOnline(false); toast('Keine Verbindung. Die letzte Änderung ist nicht gespeichert.', 'bad'); return; }
  const msg = {
    invalid: 'Das hat der Server abgelehnt.',
    spam: 'Gerade kommt sehr viel Feedback rein. Versuch es gleich nochmal.',
    conflict: 'Jemand hat gleichzeitig etwas geändert. Bitte nochmal.',
    stars: 'Dafür reichen deine Sterne nicht.',
    nomission: 'Gerade läuft keine Mission.'
  }[e.code];
  toast(msg || 'Speichern hat nicht geklappt.', 'bad');
}

const Store = {
  state: null,
  server: null,
  pending: [],
  busy: false,
  listeners: new Set(),
  memoryOnly: false,
  read() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? normalize(JSON.parse(raw)) : null;
    } catch (e) { this.memoryOnly = true; return null; }
  },
  load() {
    const fresh = this.read();
    if (fresh) { this.state = fresh; if (applyLocalNames(this.state) | applyLocalPins(this.state)) this.write(); }
    else if (!this.state) { this.state = defaultState(); applyLocalPins(this.state); this.write(); }
  },
  write() {
    if (this.memoryOnly) return;
    try { localStorage.setItem(KEY, JSON.stringify(this.state)); }
    catch (e) { toast('Speichern fehlgeschlagen. Ist der Browser-Speicher voll?', 'bad'); }
  },
  update(fn) {
    if (REMOTE) {
      if (!this.state) return;
      /* Sofort anzeigen, dann an den Server schicken */
      fn(this.state);
      syncAchievements(this.state);
      this.emit();
      this.pending.push(fn);
      this.flush();
      return;
    }
    const fresh = this.read();
    if (fresh) this.state = fresh;
    fn(this.state);
    syncAchievements(this.state);
    this.write();
    this.emit();
  },
  /* Anzeige = Serverstand + noch nicht bestätigte Änderungen */
  rebuild() {
    if (!this.server) { this.state = null; return; }
    const st = clone(this.server);
    this.pending.forEach(f => { try { f(st); syncAchievements(st); } catch (e) { console.error(e); } });
    this.state = st;
  },
  async fetchServer() {
    const d = await rpc('get_state', { p_token: session.token });
    this.server = fromServer(d);
  },
  async fetch() { await this.fetchServer(); this.rebuild(); this.emit(); },
  async flush() {
    if (this.busy) return;
    this.busy = true;
    try {
      while (this.pending.length && session && session.token && this.server) {
        const fn = this.pending[0];
        for (let attempt = 0; attempt < 4; attempt++) {
          const cand = clone(this.server);
          fn(cand);
          syncAchievements(cand);
          const patch = buildPatch(this.server, cand);
          if (!patch) break;
          try {
            const res = await rpc(cand._role === 'teacher' ? 'teacher_apply' : 'student_apply', { p_token: session.token, p: patch }) || {};
            if (res.students) Object.entries(res.students).forEach(([sid, v]) => { const x = cand.students.find(y => y.id === sid); if (x) x._v = v; });
            if (res.self != null) { const x = cand.students.find(y => y.id === cand._me); if (x) x._v = res.self; }
            if (res.meta != null) cand._metaV = res.meta;
            this.server = cand;
            setOnline(true);
            break;
          } catch (e) {
            /* Versionskonflikt: frischen Stand holen und die Änderung darauf neu anwenden */
            if (e.code === 'conflict' && attempt < 3) { try { await this.fetchServer(); continue; } catch (e2) { serverError(e2); break; } }
            serverError(e);
            try { await this.fetchServer(); } catch (e2) { /* offline */ }
            break;
          }
        }
        this.pending.shift();
      }
    } finally {
      this.busy = false;
      this.rebuild();
      this.emit();
    }
  },
  async replace(next) {
    if (!REMOTE) { this.state = normalize(next); this.write(); this.emit(); return; }
    await rpc('teacher_import', { p_token: session.token, p: next });
    await this.fetch();
  },
  reset() { this.server = null; this.state = null; this.pending = []; },
  emit() { this.listeners.forEach(l => { try { l(this.state); } catch (e) { console.error(e); } }); },
  subscribe(l) { this.listeners.add(l); return () => this.listeners.delete(l); }
};
window.addEventListener('storage', e => { if (!REMOTE && e.key === KEY) { Store.load(); Store.emit(); } });

/* Live-Abgleich: Lehrkraft jede Sekunde (Hilferufe schnell sehen), Schüler alle 3 s, im Hintergrund seltener */
let pollN = 0;
setInterval(async () => {
  if (!REMOTE || !session || !session.token || !Store.server || Store.busy || Store.pending.length) return;
  pollN++;
  if (session.role === 'student' && pollN % (document.hidden ? 12 : 3)) return;
  try {
    const v = await rpc('sync_version', { p_token: session.token });
    setOnline(true);
    if (v !== Store.server._sync && !Store.busy && !Store.pending.length) await Store.fetch();
  } catch (e) { if (e.code === 'auth') serverError(e); else setOnline(false); }
}, 1000);

/* =========================================================
   Mission (Klassenziel)
   ========================================================= */
const goalState = g => !g ? 'none' : g.wonAt ? 'won' : dayDiff(g.deadline) < 0 ? 'failed' : 'active';
function goalAdd(s, n, studentId) {
  const g = s.goal;
  if (goalState(g) !== 'active') return;
  g.progress = Math.max(0, g.progress + n);
  if (studentId) g.contrib[studentId] = Math.max(0, (g.contrib[studentId] || 0) + n);
  if (g.progress >= g.target) g.wonAt = Date.now();
}
function archiveGoal(s, outcome) {
  const g = s.goal; if (!g) return;
  s.goalHistory.unshift({ title: g.title, target: g.target, progress: g.progress, deadline: g.deadline, outcome, endedAt: Date.now(), contributors: Object.keys(g.contrib || {}).filter(k => g.contrib[k] > 0) });
  s.goalHistory = s.goalHistory.slice(0, 30);
}
function missionView(g, opts = {}) {
  const st = goalState(g);
  if (st === 'none') return opts.teacher
    ? `<div class="m-empty"><div><div class="m-kicker">Mission</div><h2 class="m-title">Keine Mission aktiv</h2><p class="hint">Setz der Klasse ein gemeinsames Ziel. Jeder Stern, den du vergibst, bringt die Rakete näher an den Planeten.</p></div><button class="btn btn-star" data-m="new">${STAR} Neue Mission starten</button></div>`
    : `<div class="m-empty"><div><div class="m-kicker">Mission</div><h2 class="m-title">Gerade keine Mission</h2><p class="hint">Bald gibt es ein neues Klassenziel. Sterne sammeln lohnt sich trotzdem.</p></div></div>`;
  const pct = Math.min(100, Math.round(g.progress / g.target * 100));
  const left = Math.max(0, g.target - g.progress), n = dayDiff(g.deadline);
  const status = st === 'won' ? '<span class="m-status won">Mission erfüllt!</span>'
    : st === 'failed' ? '<span class="m-status failed">Zeit abgelaufen</span>'
    : n === 0 ? '<span class="m-status last">Letzter Tag!</span>'
    : `<span class="m-status">Noch ${n} Tag${n === 1 ? '' : 'e'}</span>`;
  return `<div class="m-top"><div><div class="m-kicker">Mission · bis ${fmtDate(g.deadline)}</div><h2 class="m-title">${esc(g.title)}</h2>${g.details ? `<p class="m-desc">${esc(g.details)}</p>` : ''}</div>${status}</div>
    <div class="m-track ${st}"><div class="m-fill" style="width:${pct}%"></div><div class="m-rocket" style="left:${Math.max(5, Math.min(97, pct))}%">${ROCKET}</div><div class="m-planet">${PLANET}</div></div>
    <div class="m-nums">${STAR}<b>${g.progress} / ${g.target}</b><span>${st === 'won' ? 'Geschafft!' : st === 'failed' ? `${left} haben gefehlt` : `noch ${left} Sterne`}</span>${opts.extra || ''}</div>`;
}
function celebrate(g) {
  const el = document.createElement('div');
  el.className = 'celebrate';
  el.innerHTML = `<canvas></canvas><div class="cel-box"><div class="m-kicker">Mission erfüllt</div><h1 class="cel-title">GESCHAFFT!</h1><div class="cel-ship">${ROCKET}</div><p>${esc(g.title)}</p><button class="btn btn-star">Weiter</button></div>`;
  document.body.appendChild(el);
  const cv = $('canvas', el), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ffd23f', '#3be8ff', '#ff4fd8', '#3dff8b', '#8b6bff'];
  const parts = Array.from({ length: 170 }, () => ({ x: Math.random() * cv.width, y: -Math.random() * cv.height, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, s: 4 + (Math.random() * 3 | 0) * 2, c: cols[Math.random() * cols.length | 0] }));
  let raf = 0;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.y > cv.height) { p.y = -10; p.x = Math.random() * cv.width; } ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, p.s, p.s); });
    raf = requestAnimationFrame(tick);
  };
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
  chime(); setTimeout(chime, 400);
  $('button', el).addEventListener('click', () => { cancelAnimationFrame(raf); el.remove(); });
}
function checkCelebrate() {
  const g = Store.state.goal;
  if (!g || !g.wonAt || Date.now() - g.wonAt > 864e5) return;
  const k = 'sternstunde.cel.' + g.id;
  try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (e) { return; }
  celebrate(g);
}

const validBday = b => /^\d{2}-\d{2}$/.test(b || '');
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;

  const [m, d] = b.split('-').map(Number), t = today0();

function chime() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [[880, 0], [1175, .14], [880, .28]].forEach(([f, d]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();

        toast(e.code === 'offline' ? 'Keine Verbindung zum Server.' : 'Anmeldung fehlgeschlagen.', 'bad');
      }
    }
  }
  route();
}
function route() {
  cleanups.forEach(f => f()); cleanups = [];
  refresh = () => {}; keyHandler = null;
  closeAllModals();
  document.title = 'Sternstunde · Klassen-App';
  if (!session || !Store.state) { session = null; return renderLogin(); }
  if (session.role === 'teacher') return renderTeacher();
  if (session.role === 'student' && student(session.id)) return renderStudent(session.id);
  setSession(null);
}
Store.subscribe(() => refresh());
setInterval(() => refresh(), 20000);

const loginFails = { n: 0, until: 0 };
const getCode = () => { try { return localStorage.getItem(CODE_KEY) || ''; } catch (e) { return ''; } };

function renderLogin() {
  const info = REMOTE ? (Prefs.get().classInfo || null) : Store.state.settings;
  let list = null;
  $('#app').innerHTML = `
  ${!REMOTE && Store.memoryOnly ? '<div class="banner">Der Browser blockiert den Speicher. Änderungen gehen beim Schließen verloren.</div>' : ''}
  <div class="login"><div class="card login-card" id="login-card"></div></div>`;
  showRoles();

  function showRoles() {
    const card = $('#login-card');
    card.className = 'card login-card';
    card.innerHTML = `
      <div class="login-hero">
        <div class="big-star">${STAR_GOLD}</div>
        <h1>Sternstunde</h1>
        <p>${info && info.className ? `Klasse ${esc(info.className)} · Schuljahr ${esc(info.schoolYear || '')}` : 'Deine Klassen-App'}</p>
        <div class="press blink">Wähle deinen Spieler</div>
      </div>
      <div class="role-grid">
        <button class="role-btn" data-role="student"><span class="ico" style="background:var(--star-soft)">${avatarEl({ hair: 'h_tolle', hairColor: 'hc_blau', top: 't_hoodie' }, 40)}</span><span class="kick">Spieler</span><b>Ich bin in der Klasse</b><span>${REMOTE ? 'Klassencode, Namen, PIN. Steht alles auf deiner Karte.' : 'Namen wählen, PIN eingeben, los.'}</span></button>
        <button class="role-btn" data-role="teacher"><span class="ico" style="color:var(--star)">${STAR.replace('star-ico', 'star-ico" style="width:24px;height:24px')}</span><span class="kick">Kommandobrücke</span><b>Lehrkraft</b><span>Klassenübersicht, Ampel, Sterne, Termine.</span></button>
      </div>
      ${REMOTE ? '' : '<div class="demo-note"><b>Testmodus:</b> Die Daten liegen nur in diesem Browser. Öffne Lehrer- und Schüleransicht in zwei Tabs nebeneinander, dann siehst du die Live-Synchronisation. Lehrer-PIN im Testmodus: <b>0000</b>. Die Schüler-PINs stehen in der Lehreransicht unter Einstellungen.</div>'}`;
    $$('[data-role]', card).forEach(b => b.addEventListener('click', () => {
      if (b.dataset.role === 'teacher') return showPin(null);
      if (!REMOTE) return showPick(Store.state.students);
      return getCode() ? loadList(getCode()) : showCode();
    }));
  }

  function showCode(msg) {
    const card = $('#login-card');
    card.className = 'card login-card';
    card.innerHTML = `<button class="back-link" data-back>&larr; Zurück</button>
      <form class="pin-wrap" autocomplete="off">
        <h2>Klassencode</h2>
        <p class="hint" style="text-align:center">Steht auf deiner Zugangskarte. Den brauchst du nur beim ersten Mal auf diesem Gerät.</p>
        <input class="input code-input" name="code" maxlength="8" autocapitalize="characters" spellcheck="false" placeholder="z. B. ABC123" autofocus>
        <div class="pin-msg" aria-live="assertive">${esc(msg || '')}</div>
        <button class="btn btn-primary">Weiter</button>
      </form>`;
    $('[data-back]', card).addEventListener('click', showRoles);
    const form = $('form', card);
    form.code.focus();
    form.addEventListener('submit', e => {
      e.preventDefault();
      const code = form.code.value.trim().toUpperCase();
      if (code.length < 4) { $('.pin-msg', card).textContent = 'Der Code ist zu kurz.'; return; }
      loadList(code);
    });
  }

  async function loadList(code) {
    const card = $('#login-card');
    card.innerHTML = '<p class="empty">Lade Klasse …</p>';
    try {
      const r = await rpc('list_students', { p_code: code });
      if (!r || r.error) { try { localStorage.removeItem(CODE_KEY); } catch (e) { /* egal */ } showCode('Diesen Klassencode gibt es nicht.'); return; }
      try { localStorage.setItem(CODE_KEY, code); } catch (e) { /* egal */ }
      Prefs.set('classInfo', { className: r.className, schoolYear: r.schoolYear });
      list = r.students.map(x => Object.assign({}, x, { avatar: Object.assign(defaultAvatar(), x.avatar || {}) }));
      showPick(list);
    } catch (e) { showCode(e.code === 'offline' ? 'Keine Verbindung zum Server.' : 'Das hat nicht geklappt. Nochmal versuchen.'); }
  }

  function showPick(students) {
    const card = $('#login-card');
    card.className = 'card login-card wide';
    card.innerHTML = `<button class="back-link" data-back>&larr; Zurück</button>
      <h2 style="margin-bottom:1rem">Wer bist du?</h2>
      <div class="pick-grid">${students.map(st => `<button class="pick" data-id="${esc(st.id)}">${avatarEl(st.avatar, 64)}<span class="name">${esc(st.name)}</span></button>`).join('')}</div>
      ${REMOTE ? '<button class="link-btn" data-recode style="margin-top:1rem">Anderen Klassencode eingeben</button>' : ''}`;
    $('[data-back]', card).addEventListener('click', showRoles);
    $$('[data-id]', card).forEach(b => b.addEventListener('click', () => showPin(students.find(x => x.id === b.dataset.id))));
    const rc = $('[data-recode]', card);
    if (rc) rc.addEventListener('click', () => { try { localStorage.removeItem(CODE_KEY); } catch (e) { /* egal */ } showCode(); });
  }

  function showPin(st) {
    const card = $('#login-card');
    /* 0 = beliebige Länge mit OK-Taste (Lehrer-PIN im Server-Betrieb) */
    const len = st ? 4 : (REMOTE ? 0 : String(Store.state.settings.teacherPin).length);
    card.className = 'card login-card';
    card.innerHTML = `<button class="back-link" data-back>&larr; Zurück</button>
      <div class="pin-wrap">
        <div class="pin-who">${st ? avatarEl(st.avatar, 84) : `<div class="big-star" style="width:72px;height:72px;background:var(--panel-3);border:3px solid var(--edge);display:grid;place-items:center">${STAR_GOLD.replace('<svg', '<svg width="36" height="36"')}</div>`}<b>${st ? esc(st.name) : 'Lehrkraft'}</b></div>
        <div class="pin-dots"></div>
        <div class="pin-msg" aria-live="assertive"></div>
        <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="del" aria-label="Löschen">&#9003;</button><button data-k="0">0</button>${len ? '<span></span>' : '<button data-k="ok" aria-label="Bestätigen" style="font-size:12px">OK</button>'}</div>
      </div>`;
    $('[data-back]', card).addEventListener('click', () => { keyHandler = null; st ? showPick(list || Store.state.students) : showRoles(); });
    let v = '', checking = false;
    const dots = $('.pin-dots', card), msg = $('.pin-msg', card);
    const paint = () => {
      const n = len || Math.max(8, v.length);
      dots.innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < v.length ? 'on' : ''}"></i>`).join('');
    };
    const fail = text => {
      dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
      msg.textContent = text; v = ''; paint(); checking = false;
    };
    const press = key => {
      if (checking) return;
      if (Date.now() < loginFails.until) { msg.textContent = `Zu viele Versuche. Warte ${Math.ceil((loginFails.until - Date.now()) / 1000)} Sekunden.`; return; }
      if (key === 'del') { v = v.slice(0, -1); paint(); return; }
      if (key === 'ok') { if (v.length >= 4) check(); return; }
      if ((len && v.length >= len) || v.length >= 12) return;
      v += key; paint(); msg.textContent = '';
      if (len && v.length === len) setTimeout(check, 120);
    };
    const check = async () => {
      checking = true;
      if (!REMOTE) {
        Store.load();
        const fresh = st ? student(st.id) : null;
        const ok = st ? (fresh && fresh.pin === v) : v === String(Store.state.settings.teacherPin);
        if (ok) { loginFails.n = 0; keyHandler = null; setSession(st ? { role: 'student', id: st.id } : { role: 'teacher' }); return; }
        loginFails.n++;
        if (loginFails.n >= 5) { loginFails.until = Date.now() + 30000; loginFails.n = 0; }
        return fail('Falsche PIN. Nochmal.');
      }
      msg.textContent = 'Prüfe …';
      try {
        const r = st ? await rpc('login_student', { p_code: getCode(), p_id: st.id, p_pin: v }) : await rpc('login_teacher', { p_pin: v });
        if (r && r.token) { keyHandler = null; await setSession(st ? { role: 'student', id: st.id, token: r.token } : { role: 'teacher', token: r.token }); return; }
        if (r && r.error === 'code') { keyHandler = null; showCode('Der Klassencode stimmt nicht mehr.'); return; }
        if (r && r.error === 'locked') return fail(`Zu viele Versuche. Warte ${r.wait} Sekunden.`);
        if (r && r.error === 'setup') return fail('Die Datenbank ist noch nicht eingerichtet.');
        fail('Falsche PIN. Nochmal.');
      } catch (e) { fail(e.code === 'offline' ? 'Keine Verbindung zum Server.' : 'Das hat nicht geklappt.'); }
    };
    paint();
    $$('[data-k]', card).forEach(b => b.addEventListener('click', () => press(b.dataset.k)));
    keyHandler = e => {
      if (/^\d$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') press('del');
      else if (e.key === 'Enter') press('ok');
    };
  }
}

      <h2>${edit ? 'Mission bearbeiten' : 'Neue Mission'}</h2>
      <p>Jeder Stern, den du vergibst, zählt automatisch. Dazu kommen deine Bonus-Sterne und Spenden aus der Klasse.</p>
      <label class="field"><span>Was gibt es zu gewinnen?</span><input class="input" name="title" maxlength="60" required placeholder="z. B. Filmstunde mit Popcorn" value="${esc(edit ? edit.title : '')}"></label>
      <label class="field"><span>Beschreibung (optional)</span><input class="input" name="details" maxlength="140" placeholder="z. B. Gemeinsam bis zu den Weihnachtsferien" value="${esc(edit ? edit.details || '' : '')}"></label>
      <div class="row" style="align-items:flex-start">
        <label class="field" style="flex:1;min-width:120px"><span>Sterne nötig</span><input class="input" type="number" name="target" min="1" max="9999" required value="${edit ? edit.target : ''}"></label>
        <label class="field" style="flex:1.4;min-width:160px"><span>Erreichen bis</span><input class="input" type="date" name="deadline" required min="${todayISO()}" value="${edit ? edit.deadline : toISO(def)}"></label>
      </div>
      <p class="hint" id="mf-hint"></p>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-c>Abbrechen</button><button class="btn btn-star">${edit ? 'Speichern' : 'Mission starten'}</button></div>
    </form>`);
    const f = $('form', m.el);
    const hint = () => {
      const days = Math.max(1, dayDiff(/^\d{4}-\d{2}-\d{2}$/.test(f.deadline.value) ? f.deadline.value : todayISO()) + 1);
      const sug = pace ? Math.max(5, Math.round(pace / 7 * days)) : Math.max(10, Math.round(Store.state.students.length * days / 7 * 2));
      $('#mf-hint').textContent = pace
        ? `Euer Tempo der letzten zwei Wochen: etwa ${Math.round(pace)} Sterne pro Woche. Bis zur Deadline wären rund ${sug} realistisch.`
        : `Noch kein Tempo bekannt. Vorschlag: ${sug} Sterne. Lieber machbar anfangen, damit die erste Mission klappt.`;
      if (!edit && !f.target.dataset.touched) f.target.value = sug;
    };
    f.target.addEventListener('input', () => { f.target.dataset.touched = '1'; });
    f.deadline.addEventListener('change', hint);
    hint();
    $('[data-c]', m.el).addEventListener('click', () => m.close());
    f.addEventListener('submit', e => {
      e.preventDefault();
      const title = f.title.value.trim(), details = f.details.value.trim(), target = parseInt(f.target.value, 10), deadline = f.deadline.value;
      if (!title) { toast('Was gibt es zu gewinnen?', 'bad'); return; }
      if (!(target >= 1 && target <= 9999)) { toast('Sterne nötig: 1 bis 9999.', 'bad'); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(deadline) || dayDiff(deadline) < 0) { toast('Die Deadline liegt in der Vergangenheit.', 'bad'); return; }
      Store.update(s => {
        if (edit && s.goal && s.goal.id === edit.id) {
          Object.assign(s.goal, { title, details, target, deadline });
          if (!s.goal.wonAt && s.goal.progress >= target) s.goal.wonAt = Date.now();
        } else {
          if (s.goal) { const gs = goalState(s.goal); archiveGoal(s, gs === 'won' ? 'erfüllt' : gs === 'failed' ? 'verpasst' : 'abgebrochen'); }
          s.goal = { id: uid(), title, details, target, deadline, created: Date.now(), progress: 0, bonus: 0, donated: 0, contrib: {}, wonAt: null };
        }
      });
      m.close();
      toast(edit ? 'Mission aktualisiert.' : 'Mission gestartet! Die Klasse sieht sie sofort.', 'star');
    });
  }

  /* Geburtstage */

  /* Hilferufe */
  function renderHelp() {
    const list = Store.state.students.filter(s => s.help).sort((a, b) => a.help.ts - b.help.ts);
    $('#help-count').textContent = list.length;
    $('#help-panel').classList.toggle('help-on', list.length > 0);
    $('#help-list').innerHTML = list.length ? list.map(st => `
      <div class="help-item">${avatarEl(st.avatar, 40)}<div><b>${esc(st.name)}</b><small>${since(st.help.ts)} · ${clock(st.help.ts)} Uhr</small></div><button class="btn btn-primary btn-sm" data-resolve="${st.id}">Erledigt</button></div>`).join('')
      : '<div class="empty">Gerade keine Meldungen.</div>';
    $$('[data-resolve]', $('#help-list')).forEach(b => b.addEventListener('click', () => mutateStudent(b.dataset.resolve, st => { st.help = null; })));

    const now = new Set(list.map(s => s.id));
    const fresh = [...now].filter(id => !knownHelp.has(id));
    if (fresh.length) {
      if (sound.checked) chime();
      fresh.forEach(id => toast(`${student(id).name} braucht Hilfe.`, 'bad'));
    }
    knownHelp = now;
    titleBlink(list.length);
  }
  let blinkTimer = null;
  function titleBlink(n) {
    clearInterval(blinkTimer);
    if (!n) { document.title = 'Sternstunde · Lehrer'; return; }
    let on = false;
    blinkTimer = setInterval(() => { on = !on; document.title = on ? `(${n}) Hilferuf!` : 'Sternstunde · Lehrer'; }, 1000);
  }
  cleanups.push(() => clearInterval(blinkTimer));

  /* Feedback-Stream */
  $$('[data-f]', $('#feed-filter')).forEach(b => b.addEventListener('click', () => { feedFilter = b.dataset.f; Prefs.set('feedFilter', feedFilter); renderFeed(true); }));
  function renderFeed(forceBottom) {
    $$('[data-f]', $('#feed-filter')).forEach(b => b.classList.toggle('on', b.dataset.f === feedFilter));
    const feed = $('#feed');
    const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
    const all = Store.state.feedback.slice().sort((a, b) => a.ts - b.ts);
    const items = all.filter(f => feedFilter === 'alle' || f.cat === feedFilter).slice(-200);
    $('#feed-count').textContent = all.length;
    feed.innerHTML = items.length ? items.map(f => `
      <div class="msg ${seenFeed.has(f.id) ? '' : 'new'}">
        <div class="msg-top"><span class="tag tag-${f.cat}">${esc((FEEDBACK_CATS[f.cat] || FEEDBACK_CATS.sonstiges).label)}</span><span>${ago(f.ts)}</span><button class="msg-del" data-del="${f.id}" title="Nachricht löschen">&times;</button></div>
        <p>${esc(f.text)}</p>
      </div>`).join('') : '<div class="empty">Noch kein Feedback. Sobald jemand etwas schickt, läuft es hier live ein.</div>';
    const hadNew = items.some(f => !seenFeed.has(f.id));
    seenFeed = new Set(Store.state.feedback.map(f => f.id));
    if (forceBottom || nearBottom || hadNew) feed.scrollTop = feed.scrollHeight;
    $$('[data-del]', feed).forEach(b => b.addEventListener('click', () => Store.update(s => { s.feedback = s.feedback.filter(f => f.id !== b.dataset.del); })));

  };

  setType('hausaufgabe');
  $('#ev-date').value = todayISO();
  const resetForm = () => {
    editingEvent = null; evForm.reset(); setType(evType); $('#ev-date').value = todayISO();
    $('#ev-form-title').textContent = 'Neuer Eintrag'; $('#ev-submit').textContent = 'Eintragen'; $('#ev-cancel').hidden = true;
  };
  $('#ev-cancel').addEventListener('click', resetForm);
