    e.preventDefault();
    const title = $('#ev-title').value.trim(), date = $('#ev-date').value;
    if (!title || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('Titel und Datum fehlen noch.', 'bad'); return; }
    const data = { type: evType, subject: $('#ev-subject').value, title, date, details: $('#ev-details').value.trim() };
    const wasEdit = !!editingEvent;
    Store.update(s => {
      if (editingEvent) { const ev = s.events.find(x => x.id === editingEvent); if (ev) Object.assign(ev, data); }
      else s.events.push(Object.assign({ id: uid(), created: Date.now() }, data));
    });
    toast(wasEdit ? 'Eintrag geändert.' : `${EVENT_TYPES[evType].label} eingetragen. Die Klasse sieht es sofort.`);
    const keepType = evType, keepSubject = $('#ev-subject').value;
    resetForm(); setType(keepType); $('#ev-subject').value = keepSubject;
  });
  $('#ev-clear-past').addEventListener('click', async () => {
    const n = Store.state.events.filter(e => dayDiff(e.date) < 0).length;
    if (!n) { toast('Keine vergangenen Einträge.'); return; }
    if (!await confirmDialog({ title: `${n} vergangene Einträge löschen?`, ok: 'Löschen', danger: true })) return;
    Store.update(s => { s.events = s.events.filter(e => dayDiff(e.date) >= 0); });
  });
  const evHTML = (ev, withActions) => {
    const d = parseDate(ev.date), n = dayDiff(ev.date);
    return `<div class="ev ev-${ev.type} ${n < 0 ? 'past' : ''}">
      <div class="ev-date"><b>${d.getDate()}</b><small>${MON[d.getMonth()]}</small></div>
      <div class="ev-body">
        <div class="m"><span class="tag tag-${ev.type}">${EVENT_TYPES[ev.type].label}</span><span>${esc(ev.subject)}</span><span>·</span><span>${fmtDate(ev.date)}</span><span class="rel ${n >= 0 && n <= 1 ? 'soon' : ''}">${relDay(n)}</span></div>
        <div class="t">${esc(ev.title)}</div>
        ${ev.details ? `<div class="d">${esc(ev.details)}</div>` : ''}
      </div>
      ${withActions ? `<div class="ev-actions"><button class="icon-btn" data-edit="${ev.id}" title="Bearbeiten">&#9998;</button><button class="icon-btn del" data-evdel="${ev.id}" title="Löschen">&times;</button></div>` : ''}
    </div>`;
  };
  function renderEvents() {
    const evs = Store.state.events.slice().sort((a, b) => a.date.localeCompare(b.date));
    const up = evs.filter(e => dayDiff(e.date) >= 0), past = evs.filter(e => dayDiff(e.date) < 0).reverse();
    $('#ev-upcoming').innerHTML = up.length ? up.map(e => evHTML(e, true)).join('') : '<div class="empty card">Nichts eingetragen. Links kannst du Hausaufgaben, Proben und Termine anlegen.</div>';
    $('#ev-past').innerHTML = past.length ? past.slice(0, 30).map(e => evHTML(e, true)).join('') : '<div class="empty">Noch nichts vorbei.</div>';
    $$('[data-evdel]').forEach(b => b.addEventListener('click', async () => {
      if (!await confirmDialog({ title: 'Eintrag löschen?', ok: 'Löschen', danger: true })) return;
      Store.update(s => { s.events = s.events.filter(e => e.id !== b.dataset.evdel); });
      if (editingEvent === b.dataset.evdel) resetForm();

    $$('[data-edit]').forEach(b => b.addEventListener('click', () => {

        <div class="row"><span class="hint" style="flex:1;margin:0">Feedback-Verlauf: ${Store.state.feedback.length} Nachrichten</span><button class="btn btn-ghost btn-sm" id="set-clearfb">Feedback leeren</button></div>
      </div>

      <form class="card set-card danger" id="set-reset">
        <h2>Schuljahr beenden</h2><p>Setzt die App für ein neues Jahr zurück${REMOTE ? ', auf allen Geräten' : ''}. Vorher wird automatisch eine Sicherung heruntergeladen. Schüler und Namen bleiben erhalten.</p>
        <label class="check"><input type="checkbox" name="stars" checked> Sterne, Sterne-Verlauf, gekaufte Items und Missionen</label>
        <label class="check"><input type="checkbox" name="ach" checked> Erfolge und Zähler</label>
        <label class="check"><input type="checkbox" name="ampel" checked> Ampeln und Ampel-Verlauf</label>
        <label class="check"><input type="checkbox" name="feedback" checked> Feedback-Nachrichten</label>
        <label class="check"><input type="checkbox" name="events" checked> Termine, Proben, Hausaufgaben</label>
        <label class="check"><input type="checkbox" name="avatar"> Avatare (alle gestalten neu)</label>
        <label class="check"><input type="checkbox" name="pins"> Neue PINs für alle</label>
        <label class="field" style="margin-top:.6rem"><span>Neues Schuljahr</span><input class="input" name="year" maxlength="12" value="${esc(nextYear(s.schoolYear))}"></label>
        <label class="field"><span>Zur Bestätigung RESET eintippen</span><input class="input" name="confirm" autocomplete="off"></label>
        <button class="btn btn-danger">Zurücksetzen</button>
      </form>`;

    $('#set-class').addEventListener('submit', e => {
      e.preventDefault(); const f = new FormData(e.target);
      Store.update(st => { st.settings.className = f.get('className').trim() || st.settings.className; st.settings.schoolYear = f.get('schoolYear').trim(); st.settings.teacherLabel = f.get('teacherLabel').trim(); });
      toast('Gespeichert.'); renderSettings();
    });
    $('#set-pin').addEventListener('submit', async e => {
      e.preventDefault(); const f = new FormData(e.target);
      const p1 = f.get('p1').trim(), p2 = f.get('p2').trim();
      const rule = REMOTE ? /^\d{6,12}$/ : /^\d{4,8}$/;
      if (!rule.test(p1)) { toast(REMOTE ? 'Die PIN braucht 6 bis 12 Ziffern.' : 'Die PIN braucht 4 bis 8 Ziffern.', 'bad'); return; }
      if (p1 !== p2) { toast('Die beiden PINs stimmen nicht überein.', 'bad'); return; }
      if (REMOTE) {
        try { await rpc('teacher_set_pin', { p_token: session.token, p_new: p1 }); } catch (err) { serverError(err); return; }
      } else Store.update(st => { st.settings.teacherPin = p1; });
      e.target.reset(); toast('Lehrer-PIN geändert.');
    });
    $('#set-names').addEventListener('submit', async e => {
      e.preventDefault();
      const names = e.target.names.value.split('\n').map(x => x.trim().slice(0, 30)).filter(Boolean);
      if (!names.length) { toast('Die Liste ist leer.', 'bad'); return; }
      if (names.length > 40) { toast('Maximal 40 Namen.', 'bad'); return; }
      const cur = Store.state.students.length;
      if (names.length < cur) {
        const gone = Store.state.students.slice(names.length).map(x => esc(x.name)).join(', ');
        if (!await confirmDialog({ title: `${cur - names.length} Plätze entfernen?`, text: `Diese Einträge fallen weg, inklusive Sterne und Avatar: <b>${gone}</b>`, ok: 'Entfernen', danger: true })) return;
      }
      Store.update(st => {
        names.forEach((n, i) => { if (st.students[i]) st.students[i].name = n; else st.students.push(newStudent(n)); });
        st.students = st.students.slice(0, names.length);
      });
      toast('Schülerliste übernommen.'); renderSettings();
    });
    $('#set-print').addEventListener('click', printPins);
    $('#set-newpins').addEventListener('click', async () => {
      if (!await confirmDialog({ title: 'Alle PINs neu erzeugen?', text: 'Alle bisherigen PINs werden ungültig. Danach am besten gleich die PIN-Karten drucken.', ok: 'Alle neu', danger: true })) return;
      Store.update(st => st.students.forEach(x => { x.pin = randomPin(); }));
      renderSettings();
    });
    $('#set-export').addEventListener('click', () => download(backupName(), JSON.stringify(Store.state, null, 2)));
    $('#set-import').addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = async () => {
        let data;
        try { data = JSON.parse(r.result); } catch (err) { toast('Die Datei ist keine gültige Sicherung.', 'bad'); return; }
        if (!data || !Array.isArray(data.students) || !data.settings) { toast('Die Datei ist keine Sternstunde-Sicherung.', 'bad'); return; }
        if (!await confirmDialog({ title: 'Sicherung laden?', text: `Ersetzt alle aktuellen Daten durch die Sicherung mit ${data.students.length} Schülern.`, ok: 'Laden', danger: true })) return;
        try { await Store.replace(data); toast('Sicherung geladen.'); } catch (err) { serverError(err); }
        renderSettings();
      };
      r.readAsText(file);
      e.target.value = '';
    });
    $('#set-clearfb').addEventListener('click', async () => {
      if (!Store.state.feedback.length) return;
      if (!await confirmDialog({ title: 'Feedback leeren?', text: 'Alle anonymen Nachrichten werden gelöscht.', ok: 'Leeren', danger: true })) return;
      Store.update(st => { st.feedback = []; }); renderSettings();
    });
    $('#set-reset').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target;
      if (f.confirm.value.trim().toUpperCase() !== 'RESET') { toast('Bitte RESET eintippen.', 'bad'); return; }
      if (!await confirmDialog({ title: 'Wirklich zurücksetzen?', text: 'Eine Sicherung wird jetzt heruntergeladen. Danach wird zurückgesetzt.', ok: 'Ja, zurücksetzen', danger: true })) return;
      download(backupName(), JSON.stringify(Store.state, null, 2));
      const o = { stars: f.stars.checked, ampel: f.ampel.checked, feedback: f.feedback.checked, events: f.events.checked, avatar: f.avatar.checked, pins: f.pins.checked, ach: f.ach.checked, year: f.year.value.trim() };
      Store.update(st => {
        st.students.forEach(x => {
          if (o.stars) { x.stars = 0; x.earned = 0; x.starLog = []; x.owned = []; x.donatedTotal = 0; }
          if (o.ach) { x.achievements = {}; x.flags = {}; x.helpCount = 0; x.loginDays = []; x.joined = null; }
          Object.keys(SLOT_DEFAULT).forEach(slot => { const cur = x.avatar[slot]; if (cur && !owns(x, cur)) x.avatar[slot] = SLOT_DEFAULT[slot]; });
          if (!owns(x, x.avatar.skin)) x.avatar.skin = 's3';
          if (o.ampel) { x.ampel = 'gruen'; x.ampelNote = ''; x.ampelUpdated = null; x.ampelHistory = []; }
          if (o.avatar) { x.avatar = defaultAvatar(); x.setupDone = false; }
          if (o.pins) x.pin = randomPin();
          x.help = null;
        });
        if (o.stars) { st.goal = null; st.goalHistory = []; }
        if (o.feedback) st.feedback = [];
        if (o.events) st.events = [];
        if (o.year) st.settings.schoolYear = o.year;
      });
      if (o.ach) { try { Object.keys(localStorage).filter(k => k.startsWith('sternstunde.private.')).forEach(k => localStorage.removeItem(k)); } catch (err) { /* egal */ } }
      toast('Neues Schuljahr, neues Glück. Alles zurückgesetzt.');
      renderSettings();
    });
  }
  function nextYear(y) { const m = String(y).match(/(\d{4})\D+(\d{2,4})/); if (!m) return y; const a = +m[1] + 1; return `${a}/${String(a + 1).slice(-2)}`; }

  function printPins() {
    const s = Store.state.settings;
    const url = /^https?:/.test(location.protocol) ? location.href.split('#')[0] : '';
    const code = REMOTE ? Store.state._classCode : '';
    $('#print-area').innerHTML = `<div class="print-head">Sternstunde · Klasse ${esc(s.className)} · Zugangskarten</div><div class="pin-cards">${Store.state.students.map(x => `<div class="pin-card"><div class="n">${esc(x.name)}</div><div class="p">${esc(x.pin)}</div><div class="i">${code ? `Klassencode: <b>${esc(code)}</b><br>` : ''}Deine PIN für Sternstunde. Nicht weitergeben.${url ? '<br>' + esc(url) : ''}</div></div>`).join('')}</div>`;
    document.body.classList.add('print-pins');
    const done = () => { document.body.classList.remove('print-pins'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    window.print();
    setTimeout(done, 1500);
  }

  /* Live-Refresh: nur dynamische Bereiche neu zeichnen, Formulare bleiben unberührt */
  refresh = () => {
    $('#t-class').textContent = `Klasse ${Store.state.settings.className} · ${Store.state.settings.schoolYear}`;
    renderMission(); renderStats(); renderGrid(); renderHelp(); renderBdays(); renderFeed(false); renderEvents();
    checkCelebrate();
    if (drawer) drawer.paint();
  };
  document.title = 'Sternstunde · Lehrer';
  refresh();
  renderFeed(true);
}

/* =========================================================
   Schüleransicht
   ========================================================= */
function renderStudent(id) {
  let last = (() => { const s = student(id); return { earned: s.earned, ampelUpdated: s.ampelUpdated, help: !!s.help }; })();
  let fbCat = 'unklar';
  let starBurst = 0, starBurstTimer = null;
  let lastAch = null;

  $('#app').innerHTML = `
  <header class="topbar">
    <div class="brand"><span class="brand-mark">${STAR_GOLD}</span><div>Sternstunde<small id="s-class"></small></div></div>
    <span class="spacer"></span>
    ${REMOTE ? '<span class="live hide-sm"><i></i>Live</span>' : ''}
    <span class="star-pill" id="s-stars" title="Dein Stern-Guthaben"></span>
    <button class="btn btn-ghost btn-sm" id="s-logout">Abmelden</button>
  </header>
  ${session.preview ? `<div class="banner">Vorschau als <b>${esc(student(id).name)}</b>. Aktionen hier sind echt (Hilferuf, Feedback, Käufe). <button class="btn btn-star btn-sm" id="s-back" style="margin-left:.6rem">Zurück zur Lehreransicht</button></div>` : ''}
  <main class="st-main">
    <div class="bday-banner" id="s-bday-banner" hidden></div>
    <section class="card st-card st-hero" id="s-hero"></section>

    <section class="card st-card st-help">
      <button class="panic" id="s-panic" aria-pressed="false" aria-label="Notfallknopf: Ich komme nicht weiter"></button>
      <div class="panic-state" id="s-panic-state"></div>
    </section>

    <section class="card st-card st-ampel" id="s-ampel"></section>

    <section class="card st-card st-mission mission" id="s-mission"></section>

    <section class="card st-card st-events">
      <h2>Was steht an?</h2>
      <div class="ev-split">
        <div class="ev-col"><div class="ev-col-head hw"><h3>Hausaufgaben</h3><span class="count" id="s-hw-n">0</span></div><div class="ev-list" id="s-hw"></div></div>
        <div class="ev-col"><div class="ev-col-head dt"><h3>Termine &amp; Proben</h3><span class="count" id="s-dt-n">0</span></div><div class="ev-list" id="s-dates"></div></div>
      </div>
    </section>

    <section class="card st-card st-feedback">
      <h2>Feedback <span class="anon">anonym</span></h2>
      <p class="sub" id="fb-hint"></p>
      <form id="fb-form">
        <div class="fb-cats" id="fb-cats">${Object.entries(FEEDBACK_CATS).map(([k, v]) => `<button type="button" class="chip" data-cat="${k}">${v.label}</button>`).join('')}</div>
        <textarea class="textarea" id="fb-text" maxlength="${FB_MAX}" placeholder="Schreib einfach los. Dein Name wird nicht mitgeschickt."></textarea>
        <div class="fb-foot"><small id="fb-count">0 / ${FB_MAX}</small><span class="spacer"></span><button class="btn btn-brand" id="fb-send">Anonym senden</button></div>
      </form>
    </section>

    <section class="card st-card st-bday">
      <div class="bday-month"><h2 id="s-bday-title">Geburtstage</h2></div>
      <div class="bday-list" id="s-bday" style="padding:0"></div>
    </section>

    <section class="card st-card st-ach">
      <h2>Erfolge <span class="ach-count" id="s-ach-count"></span></h2>
      <p class="sub">Für Erfolge gibt es Abzeichen, für manche sogar Items, die man nicht kaufen kann. Einer ist geheim.</p>
      <div class="ach-grid" id="s-ach"></div>
    </section>

    <section class="card st-card st-log">
      <h2>${STAR} Deine Sterne</h2>
      <p class="sub">Für gutes Verhalten gibt es Stern-Coins. Damit schaltest du im Shop Frisuren, Kleidung und Accessoires frei.</p>
      <div class="starlog" id="s-log"></div>
    </section>
  </main>`;

  $('#s-logout').addEventListener('click', () => setSession(session.preview ? { role: 'teacher', token: session.token } : null));
  let secretClicks = [];
  $('.brand-mark').addEventListener('click', () => {
    secretClicks = secretClicks.filter(t => Date.now() - t < 4000).concat(Date.now());
    if (secretClicks.length >= 7 && !student(id).flags.secret) mutateStudent(id, s => { s.flags.secret = true; });
  });
  if (session.preview) $('#s-back').addEventListener('click', () => setSession({ role: 'teacher', token: session.token }));

  /* Notfallknopf */
  $('#s-panic').addEventListener('click', () => {
    const on = !student(id).help;
    mutateStudent(id, s => { s.help = on ? { ts: Date.now() } : null; if (on && !session.preview) s.helpCount = (s.helpCount || 0) + 1; });
    if (on && navigator.vibrate) navigator.vibrate(60);
  });

  /* Feedback */
  const setCat = c => { fbCat = c; $$('[data-cat]').forEach(b => b.classList.toggle('on', b.dataset.cat === c)); $('#fb-hint').textContent = FEEDBACK_CATS[c].hint; };
  $$('[data-cat]').forEach(b => b.addEventListener('click', () => setCat(b.dataset.cat)));
  setCat('unklar');
  const fbText = $('#fb-text');
  fbText.addEventListener('input', () => { $('#fb-count').textContent = `${fbText.value.length} / ${FB_MAX}`; });
  $('#fb-form').addEventListener('submit', e => {
    e.preventDefault();
    const text = fbText.value.trim().replace(/\n{3,}/g, '\n\n');
    if (text.length < 3) { toast('Schreib noch ein bisschen mehr.', 'bad'); return; }
    let lastSent = 0;
    try { lastSent = +sessionStorage.getItem('sternstunde.fb') || 0; } catch (err) { /* egal */ }
    const wait = FB_COOLDOWN_MS - (Date.now() - lastSent);
    if (wait > 0) { toast(`Kurz durchatmen: noch ${Math.ceil(wait / 1000)} Sekunden.`, 'bad'); return; }
    /* Bewusst ohne Schüler-ID gespeichert: Die Lehrkraft kann nicht sehen, von wem es kommt. */
    Store.update(s => { s.feedback.push({ id: uid(), ts: Date.now(), cat: fbCat, text }); s.feedback = s.feedback.slice(-500); });
    try { sessionStorage.setItem('sternstunde.fb', String(Date.now())); } catch (err) { /* egal */ }
    if (!session.preview) { const p = Private.get(id); p.fbCount++; Private.set(id, p); refresh(); }
    fbText.value = ''; $('#fb-count').textContent = `0 / ${FB_MAX}`;
    toast('Danke! Dein Feedback ist angekommen.');
  });

  function render() {
    const st = student(id);
    if (!st) { setSession(null); return; }
    const set = Store.state.settings;
    const teacher = set.teacherLabel || 'Deine Lehrkraft';
    $('#s-class').textContent = `Klasse ${set.className}`;

    /* Spitzname nur für die Person selbst, nie in der Lehrer-Vorschau */
    const display = !session.preview && st.nick ? st.nick : st.name;
    const afford = CATALOG.filter(i => i.price > 0 && i.price <= st.stars && !st.owned.includes(i.id)).length;
    const pill = $('#s-stars');
    pill.innerHTML = `${STAR}${st.stars}`;

    $('#s-hero').innerHTML = `
      <span class="av" id="s-av" style="width:132px;height:132px" title="Avatar bearbeiten">${avatarSVG(st.avatar)}</span>
      <div style="position:relative;z-index:1">
        <div class="hello">Hallo,</div>
        <h1>${esc(display)}</h1>${session.preview ? '' : `<button class="link-btn nick-link" id="s-nick">${st.nick ? 'Spitzname ändern' : 'Spitzname festlegen'}</button>`}
        <button class="btn btn-star" id="s-shop">${STAR} Shop &amp; Garderobe</button>
        ${afford ? `<span class="afford">Du kannst dir ${afford} Item${afford > 1 ? 's' : ''} leisten!</span>` : ''}
        <div class="earned">${st.earned} Sterne gesammelt · ${st.owned.length} Items freigeschaltet</div>
      </div>`;
    $('#s-av').addEventListener('click', () => openWardrobe(id, false));
    const nl = $('#s-nick'); if (nl) nl.addEventListener('click', () => openNickDialog(id, null, { edit: true }));
    $('#s-shop').addEventListener('click', () => openWardrobe(id, false));

    const panic = $('#s-panic');
    panic.classList.toggle('active', !!st.help);
    panic.setAttribute('aria-pressed', st.help ? 'true' : 'false');
    panic.innerHTML = `<span class="p-big">SOS</span><span class="p-small">${st.help ? 'Gemeldet' : 'Ich komme nicht weiter'}</span>`;
    const ps = $('#s-panic-state');
    ps.classList.toggle('on', !!st.help);
    ps.innerHTML = st.help ? `${esc(teacher)} weiß Bescheid (${since(st.help.ts)}).<br><a href="#" id="s-cancel" style="color:inherit">Hat sich erledigt</a>` : 'Drück, wenn du festhängst. Nur die Lehrkraft sieht es.';
    const cancel = $('#s-cancel');
    if (cancel) cancel.addEventListener('click', e => { e.preventDefault(); mutateStudent(id, s => { s.help = null; }); });

    const A = AMPEL[st.ampel];
    $('#s-ampel').innerHTML = `
      <h2>Deine Ampel</h2>
      <p class="sub">Nur du und ${esc(teacher)} sehen sie.</p>
      <div class="traffic">
        <div class="traffic-box"><i class="r ${st.ampel === 'rot' ? 'on' : ''}"></i><i class="y ${st.ampel === 'gelb' ? 'on' : ''}"></i><i class="g ${st.ampel === 'gruen' ? 'on' : ''}"></i></div>
        <div><b>${A.title}</b><div class="note">${st.ampelNote ? esc(st.ampelNote) : (st.ampel === 'gruen' ? 'Weiter so!' : '')}</div>${st.ampelUpdated ? `<div class="when">${ago(st.ampelUpdated)}</div>` : ''}</div>
      </div>`;

    const evCard = ev => {
      const d = parseDate(ev.date), n = dayDiff(ev.date);
      return `<div class="ev ev-${ev.type}">
        <div class="ev-date"><b>${d.getDate()}</b><small>${MON[d.getMonth()]}</small></div>
        <div class="ev-body"><div class="m">${ev.type === 'hausaufgabe' ? '' : `<span class="tag tag-${ev.type}">${(EVENT_TYPES[ev.type] || { label: 'Geburtstag' }).label}</span>`}<span>${esc(ev.subject)}</span><span>·</span><span>${fmtDate(ev.date)}</span><span class="rel ${n <= 1 && ev.type !== 'geburtstag' ? 'soon' : ''}">${relDay(n)}</span></div>
        <div class="t">${esc(ev.title)}</div>${ev.details ? `<div class="d">${esc(ev.details)}</div>` : ''}</div></div>`;
    };
    const upcoming = Store.state.events.filter(e => dayDiff(e.date) >= 0).sort((x, y) => x.date.localeCompare(y.date));
    const hw = upcoming.filter(e => e.type === 'hausaufgabe');
    const dates = upcoming.filter(e => e.type !== 'hausaufgabe').concat(bdayEvents(14)).sort((x, y) => x.date.localeCompare(y.date));
    $('#s-hw-n').textContent = hw.length;
    $('#s-dt-n').textContent = dates.length;
    $('#s-hw').innerHTML = hw.length ? hw.map(evCard).join('') : '<div class="empty">Keine Hausaufgaben offen. Stark!</div>';
    $('#s-dates').innerHTML = dates.length ? dates.map(evCard).join('') : '<div class="empty">Keine Termine oder Proben in Sicht.</div>';

    $('#s-log').innerHTML = st.starLog.length ? st.starLog.slice(0, 24).map(l => `<span class="sl ${l.amount < 0 ? 'minus' : ''}">${l.amount > 0 ? STAR + '+' + l.amount : '&minus;' + Math.abs(l.amount)} ${esc(l.reason)} <small>${ago(l.ts)}</small></span>`).join('') : '<div class="empty" style="width:100%">Noch keine Sterne. Der erste kommt bestimmt.</div>';

    /* Mission */
    const g = Store.state.goal, gs = goalState(g), mBox = $('#s-mission');
    mBox.className = 'card st-card st-mission mission ' + gs;
    const mine = g && g.contrib ? (g.contrib[id] || 0) : 0;
    mBox.innerHTML = missionView(g, { extra: gs !== 'none' ? `<span class="mine">Dein Beitrag: ${mine}</span>` : '' })
      + (gs === 'active' ? `<div class="m-donate"><p class="hint">Spende eigene Sterne an die Mission. Sie sind dann weg, bringen aber die ganze Klasse näher ans Ziel.</p><button class="btn btn-ghost btn-sm" data-donate="1" ${st.stars < 1 ? 'disabled' : ''}>1 ${STAR} spenden</button><button class="btn btn-star btn-sm" data-donate="5" ${st.stars < 5 ? 'disabled' : ''}>5 ${STAR} spenden</button></div>` : '');
    $$('[data-donate]', mBox).forEach(b => b.addEventListener('click', () => donate(+b.dataset.donate)));

    /* Geburtstage */
    const mo = new Date().getMonth();
    $('#s-bday-title').textContent = `Geburtstage im ${MONTHS[mo]}`;
    $('#s-bday').innerHTML = bdayListHTML(mo, id);
    const todays = Store.state.students.filter(x => x.id !== id && isBdayToday(x.birthday));
    const bb = $('#s-bday-banner');
    if (isBdayToday(st.birthday)) { bb.hidden = false; bb.innerHTML = `${CAKE}<div><b>Alles Gute zum Geburtstag, ${esc(display)}!</b><div class="hint" style="color:var(--ink-2)">Die ganze Klasse feiert mit.</div></div>`; }
    else if (todays.length) { bb.hidden = false; bb.innerHTML = `${CAKE}<div><b>Heute hat ${todays.map(x => esc(x.name)).join(' und ')} Geburtstag!</b><div class="hint" style="color:var(--ink-2)">Gratulier doch mal.</div></div>`; }
    else bb.hidden = true;

    checkCelebrate();

    /* Erfolge */
    const priv = syncPrivate(id);
    const al = achList(st, Store.state, priv);
    $('#s-ach-count').textContent = `${al.filter(x => x.done).length} / ${al.length}`;
    $('#s-ach').innerHTML = al.map(achBadge).join('');
    const nowAch = new Set(al.filter(x => x.done).map(x => x.a.id));
    if (lastAch) nowAch.forEach(aid => { if (!lastAch.has(aid)) showAch(ACH.find(x => x.id === aid)); });
    lastAch = nowAch;
    /* Zeitbasierte Erfolge (z. B. 7 Tage grün) brauchen einen Anstoß */
    if (ACH.some(x => !x.priv && !st.achievements[x.id] && x.prog(st, Store.state) >= x.goal)) setTimeout(() => Store.update(() => {}), 0);

    /* Rückmeldungen, die live reinkommen, kurz hervorheben */
    if (st.earned > last.earned) {
      const l = st.starLog[0];
      starBurst += st.earned - last.earned;
      clearTimeout(starBurstTimer); starBurstTimer = setTimeout(() => { starBurst = 0; }, 4000);
      toast(`+${starBurst} Stern${starBurst > 1 ? 'e' : ''}: ${l ? l.reason : 'Gutes Verhalten'}`, 'star', 'stars');
      pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
    }
    if (st.ampelUpdated && st.ampelUpdated !== last.ampelUpdated && last.ampelUpdated !== undefined) {
      if (st.ampelUpdated > (last.ampelUpdated || 0)) toast(`Deine Ampel: ${AMPEL[st.ampel].label}`, st.ampel === 'gruen' ? '' : 'bad', 'ampel');
    }
    if (last.help && !st.help) toast('Hilferuf erledigt.');
    last = { earned: st.earned, ampelUpdated: st.ampelUpdated, help: !!st.help };
  }

  async function donate(n) {
    const st = student(id);
    if (st.stars < n) { toast('Dafür reichen deine Sterne nicht.', 'bad'); return; }
    if (n > 1 && !await confirmDialog({ title: `${n} Sterne spenden?`, text: `Die Sterne gehen in den Missions-Topf. Danach hast du noch ${st.stars - n}.`, ok: 'Spenden' })) return;
    if (REMOTE) {
      try { await rpc('donate', { p_token: session.token, p_n: n }); toast(`Danke! ${n} Stern${n > 1 ? 'e' : ''} für die Mission.`, 'star'); await Store.fetch(); }
      catch (e) { serverError(e); }
      return;
    }
    let ok = false;
    mutateStudent(id, (s, S) => {
      if (goalState(S.goal) !== 'active' || s.stars < n) return;
      s.stars -= n; s.donatedTotal = (s.donatedTotal || 0) + n; S.goal.donated += n; goalAdd(S, n, s.id);
      s.starLog.unshift({ ts: Date.now(), amount: -n, reason: 'Für die Mission gespendet' });
      ok = true;
    });
    toast(ok ? `Danke! ${n} Stern${n > 1 ? 'e' : ''} für die Mission.` : 'Hat nicht geklappt.', ok ? 'star' : 'bad');
  }

  refresh = () => { render(); if (wardrobe) wardrobe.paintBalance(); };
  render();
  document.title = 'Sternstunde';
  if (!session.preview) {
    mutateStudent(id, s => {
      const d = todayISO(), now = new Date();
      if (!s.loginDays.includes(d)) s.loginDays = s.loginDays.concat(d).slice(-400);
      if (!s.joined) s.joined = Date.now();
      if (now.getDay() > 0 && now.getDay() < 6 && now.getHours() * 60 + now.getMinutes() < 450) s.flags.early = true;
      if (isBdayToday(s.birthday)) s.flags.bday = true;
    });
  }
  /* Erster Login: Geburtstag, Spitzname, Avatar */
  const s0 = student(id), steps = [];
  if (!s0.bdayAsked) steps.push(next => openBdayDialog(id, next));
  if (!s0.nickAsked) steps.push(next => openNickDialog(id, next));
  steps.push(() => { if (student(id) && !student(id).setupDone) openWardrobe(id, true); });
  const run = i => { if (steps[i]) steps[i](() => run(i + 1)); };
  run(0);
}

/* =========================================================
   Garderobe und Shop
   ========================================================= */
let wardrobe = null;
function openWardrobe(id, firstTime) {
  const st0 = student(id);
  let draft = clone(st0.avatar);
  let tab = firstTime ? 'base' : 'hair';
  let tryOn = null;

  const m = openModal(`
    ${firstTime ? '' : '<button class="x-btn" data-x aria-label="Schließen">&times;</button>'}
    <div class="wd">
      <div class="wd-preview">
        <h2>${firstTime ? 'Gestalte deinen Avatar' : 'Deine Garderobe'}</h2>
        <span class="av" id="wd-av" style="width:180px;height:180px"></span>
        <span class="star-pill" id="wd-bal"></span>
        <div class="wd-try" id="wd-try"></div>
      </div>
      <div class="wd-main">
        <div class="wd-tabs" id="wd-tabs"></div>
        <div class="wd-items" id="wd-items"></div>
        <div class="wd-foot"><small id="wd-foot-hint"></small>${firstTime ? '' : '<button class="btn btn-ghost" data-x>Abbrechen</button>'}<button class="btn btn-primary" id="wd-save">${firstTime ? 'Los geht\'s' : 'Speichern'}</button></div>
      </div>
    </div>`, { cls: 'wide', dismissable: !firstTime, onClose: () => { wardrobe = null; } });

  $$('[data-x]', m.el).forEach(b => b.addEventListener('click', () => m.close()));

  const preview = () => { $('#wd-av').innerHTML = avatarSVG(draft); };

  function paintBalance() {
    const st = student(id); if (!st) return;
    $('#wd-bal').innerHTML = `${STAR}${st.stars} Sterne`;
    paintTry();
  }

  function paintTry() {
    const st = student(id), box = $('#wd-try');
    const unowned = Object.keys(SLOT_DEFAULT).map(k => draft[k]).concat(draft.skin).filter(i => i && !owns(st, i));
    if (tryOn && ITEM[tryOn].ach && !owns(st, tryOn)) {
      const A = ACH.find(x => x.id === ITEM[tryOn].ach);
      box.innerHTML = `<b>Anprobe: ${esc(ITEM[tryOn].name)}</b>Gibt es nicht zu kaufen. Du bekommst es mit dem Erfolg „${esc(A.name)}“: ${esc(A.desc)}.`;
    } else if (tryOn && !owns(st, tryOn)) {
      const it = ITEM[tryOn], missing = it.price - st.stars;
      box.innerHTML = `<b>Anprobe: ${esc(it.name)}</b>${missing > 0 ? `Dir fehlen noch ${missing} Stern${missing > 1 ? 'e' : ''}.` : 'Sieht gut aus, oder?'}<button class="btn btn-star" id="wd-buy" ${missing > 0 ? 'disabled' : ''}>${STAR} Freischalten für ${it.price}</button>`;
      $('#wd-buy').addEventListener('click', () => buy(tryOn));
    } else if (firstTime) {
      box.innerHTML = '<b>Dein Start-Look</b>Später kannst du mit Stern-Coins Frisuren, Kleidung und Accessoires freischalten.';
    } else {
      box.innerHTML = `<b>So geht's</b>Tippe auf ein Item zum Anprobieren. Gesperrte Items schaltest du mit Sternen frei.`;
    }
    $('#wd-foot-hint').textContent = unowned.length ? 'Anprobierte Items, die du noch nicht hast, werden beim Speichern wieder abgelegt.' : '';
  }

  function paintTabs() {
    $('#wd-tabs').innerHTML = SLOTS.map(s => `<button class="chip ${s.key === tab ? 'on' : ''}" data-tab="${s.key}">${s.label}</button>`).join('');
    $$('[data-tab]', $('#wd-tabs')).forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; paintTabs(); paintItems(); }));
  }

  function itemCard({ key, label, preview: pv, on, locked, price, rar, ach }) {
    return `<button class="item ${on ? 'on' : ''} ${locked ? 'locked' : ''}" data-pick="${key}">
      ${rar ? `<span class="rar rar-${rar[0]}">${rar[1]}</span>` : ''}
      ${pv}
      <span class="nm">${esc(label)}</span>
      ${locked ? (ach ? '<span class="pr lock">Erfolg</span>' : `<span class="pr lock">${STAR}${price}</span>`) : on ? '<span class="pr own">angezogen</span>' : price ? '<span class="pr own">deins</span>' : '<span class="pr" style="color:var(--muted)">frei</span>'}
    </button>`;
  }

  function paintItems() {
    const st = student(id);
    const box = $('#wd-items');
    let html = '';
    if (tab === 'base') {
      html += `<div class="label" style="grid-column:1/-1">Hautton</div>`;
      html += Object.entries(SKINS).map(([k, c]) => itemCard({ key: 'skin:' + k, label: ' ', preview: `<span class="swatch" style="background:${c}"></span>`, on: draft.skin === k })).join('');
      html += `<div class="label" style="grid-column:1/-1;margin-top:.4rem">Fantasy-Haut</div>`;
      html += CATALOG.filter(i => i.slot === 'skin').map(it => itemCard({ key: 'skin:' + it.id, label: it.name, preview: avatarEl(Object.assign({}, draft, { skin: it.id }), 80), on: draft.skin === it.id, locked: !owns(st, it.id), price: it.price, rar: rarity(it.price) })).join('');
      html += `<div class="label" style="grid-column:1/-1;margin-top:.4rem">Gesicht</div>`;
      html += Object.entries(FACES).map(([k, n]) => itemCard({ key: 'face:' + k, label: n, preview: avatarEl(Object.assign({}, draft, { face: k }), 80), on: draft.face === k })).join('');
    } else {
      const slot = SLOTS.find(s => s.key === tab);
      if (slot.optional) html += itemCard({ key: tab + ':', label: 'Nichts', preview: '<span class="none-ico">&empty;</span>', on: !draft[tab] });
      html += CATALOG.filter(i => i.slot === tab).map(it => {
        const pv = tab === 'hairColor'
          ? avatarEl(Object.assign({}, draft, { hairColor: it.id, hat: null }), 80)
          : avatarEl(Object.assign({}, draft, { [tab]: it.id }, tab === 'hair' ? { hat: null } : {}), 80);
        return itemCard({ key: tab + ':' + it.id, label: it.name, preview: pv, on: draft[tab] === it.id, locked: !owns(st, it.id), price: it.price, rar: it.ach ? ['erfolg', 'Erfolg'] : rarity(it.price), ach: it.ach });
      }).join('');
    }
    box.innerHTML = html;
    $$('[data-pick]', box).forEach(b => b.addEventListener('click', () => pick(b.dataset.pick)));
  }

  function pick(key) {
    const [slot, val] = key.split(':');
    if (slot === 'skin' || slot === 'face') { draft[slot] = val; tryOn = ITEM[val] && !owns(student(id), val) ? val : null; }
    else {
      const v = val || null;
      const s = SLOTS.find(x => x.key === slot);
      draft[slot] = (s.optional && draft[slot] === v && v) ? null : v;
      tryOn = draft[slot] && !owns(student(id), draft[slot]) ? draft[slot] : null;
    }
    preview(); paintItems(); paintTry();
  }

  async function buy(itemId) {
    const it = ITEM[itemId];
    const st = student(id);
    if (owns(st, itemId) || it.ach) return;
    if (st.stars < it.price) { toast(`Dir fehlen noch ${it.price - st.stars} Sterne.`, 'bad'); return; }
    if (!await confirmDialog({ title: `${it.name} freischalten?`, text: `Kostet ${it.price} Stern${it.price > 1 ? 'e' : ''}. Danach hast du noch ${st.stars - it.price}.`, ok: `Für ${it.price} Sterne freischalten` })) return;
    let ok = false;
    mutateStudent(id, s => {
      if (s.owned.includes(itemId) || s.stars < it.price) return;
      s.stars -= it.price; s.owned.push(itemId); ok = true;
    });
    if (!ok) { toast('Hat nicht geklappt, dein Guthaben reicht nicht.', 'bad'); return; }
    tryOn = null;
    toast(`${it.name} gehört jetzt dir!`, 'star');
    paintItems(); paintTry();
  }

  $('#wd-save').addEventListener('click', () => {
    const st = student(id);
    const final = clone(draft);
    Object.keys(SLOT_DEFAULT).forEach(k => { if (final[k] && !owns(st, final[k])) final[k] = owns(st, st.avatar[k]) ? st.avatar[k] : SLOT_DEFAULT[k]; });
    if (!owns(st, final.skin)) final.skin = owns(st, st.avatar.skin) ? st.avatar.skin : 's3';
    mutateStudent(id, s => { s.avatar = final; s.setupDone = true; });
    m.close();
    toast(firstTime ? 'Willkommen! Dein Avatar ist fertig.' : 'Gespeichert.');
  });

  wardrobe = { paintBalance };
  preview(); paintTabs(); paintItems(); paintBalance();
}

/* =========================================================
   Start
   ========================================================= */
/* Start: lokal sofort, im Server-Betrieb erst Daten holen */
(async function boot() {
  initStarfield();
  if (!REMOTE) { Store.load(); route(); return; }
  if (session && session.token) {
    $('#app').innerHTML = '<div class="login"><div class="card login-card"><p class="empty">Lade Daten …</p></div></div>';
    try { await Store.fetch(); }
    catch (e) { session = null; Store.reset(); try { sessionStorage.removeItem(SESSION_KEY); } catch (e2) { /* egal */ } }
  } else session = null;
  route();
})();
})();
</script>
